<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOL GM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEFF2;--surf:#FFFFFF;--ink:#18212B;--mut:#5D6B78;--line:#D5DBE1;--brass:#9C7A2F;--blue:#2F6CD4;--red:#C9412F;--blue-t:rgba(47,108,212,.14);--red-t:rgba(201,65,47,.13);
  --on-brass:#FFFFFF;--hi:#1F7A4D;--mi:#8A6A1C;--lo:#9A3B2E;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121820;--surf:#1B232D;--ink:#E6EBF0;--mut:#93A1AE;--line:#2C3743;--brass:#D9B064;--blue:#5B95F0;--red:#EC6A55;--blue-t:rgba(91,149,240,.18);--red-t:rgba(236,106,85,.16);--on-brass:#1B1405;--hi:#5FCB93;--mi:#D9B064;--lo:#EC8A78}}
:root[data-theme="dark"]{--bg:#121820;--surf:#1B232D;--ink:#E6EBF0;--mut:#93A1AE;--line:#2C3743;--brass:#D9B064;--blue:#5B95F0;--red:#EC6A55;--blue-t:rgba(91,149,240,.18);--red-t:rgba(236,106,85,.16);--on-brass:#1B1405;--hi:#5FCB93;--mi:#D9B064;--lo:#EC8A78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{display:flex;align-items:baseline;gap:14px;padding:18px 20px 6px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
header h1{font:400 34px/1 "Black Han Sans","IBM Plex Sans KR",sans-serif;margin:0;letter-spacing:.5px}
header h1 span{color:var(--brass)}
header p{margin:0;color:var(--mut);font-size:13px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav div{max-width:1100px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 12px}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:500 15px "IBM Plex Sans KR",sans-serif;padding:12px 10px 9px;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brass)}
main{max-width:1100px;margin:0 auto;padding:14px 16px 60px}
section{margin:0 0 22px}
h2{font:400 26px/1.2 "Black Han Sans",sans-serif;margin:0 0 4px}
h3{font-size:15px;font-weight:700;margin:0 0 8px;color:var(--mut)}
h4{font-size:13px;margin:0 0 6px;color:var(--brass)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px}
.controls label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut);min-width:0}
.controls select,.controls input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:15px;color:var(--ink);min-width:0}
.seedrow{display:flex;gap:4px}.seedrow input{width:130px}
.primary{background:var(--brass);color:var(--on-brass);border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
.empty,.hint{color:var(--mut);font-size:14px}
.empty{padding:28px 4px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:18px;padding:18px 8px;border-top:3px solid var(--blue);border-bottom:3px solid var(--red);background:linear-gradient(90deg,var(--blue-t),transparent 40%,transparent 60%,var(--red-t))}
.side .tname{word-break:keep-all;font:400 clamp(18px,4.2vw,30px)/1.1 "Black Han Sans",sans-serif}
.side.red{text-align:right}
.side .res{font-size:13px;color:var(--mut);margin-top:4px}
.side.won .res{color:var(--brass);font-weight:700}
.side.blue .tname{color:var(--blue)}.side.red .tname{color:var(--red)}
.score{text-align:center;font:400 clamp(40px,10vw,76px)/1 "Black Han Sans",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.score i{font-style:normal;color:var(--mut);margin:0 .12em}
.score .dur{font:500 13px "IBM Plex Sans KR",sans-serif;color:var(--mut);margin-top:6px;white-space:normal}
.tstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-14px 0 22px}
.tstat{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);padding:8px 2px}
.tstat.red{justify-content:flex-end}
.tstat.blue{border-top:2px solid var(--blue)}.tstat.red{border-top:2px solid var(--red)}
.tstat b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.draft{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dside{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px;border-top:3px solid var(--blue)}
.dside.red{border-top-color:var(--red)}
.bans{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.ban{font-size:12px;color:var(--mut);text-decoration:line-through;border:1px dashed var(--line);border-radius:4px;padding:1px 6px}
.pick{display:grid;grid-template-columns:38px 1fr;column-gap:6px;padding:5px 0;border-top:1px solid var(--line)}
.pick .pn{grid-column:2;font-size:12px;color:var(--mut)}
.role{display:inline-block;font-size:11px;font-weight:700;color:var(--brass);min-width:30px}
svg.gold{width:100%;min-width:520px;height:auto;background:var(--surf);border:1px solid var(--line);border-radius:10px}
.ga-blue{fill:var(--blue-t)}.ga-red{fill:var(--red-t)}.gl{fill:none;stroke:var(--ink);stroke-width:1.6}.axis{stroke:var(--line)}
.tick{font-size:10px;fill:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surf)}
th{font-size:12px;font-weight:500;color:var(--mut);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.pt{margin-bottom:10px;border-left:3px solid var(--blue)}.pt.red{border-left-color:var(--red)}
.pt .items{font-size:12px;color:var(--mut);white-space:normal;min-width:180px}
span.num.hi{color:var(--hi);font-weight:700}span.num.mid{color:var(--mi);font-weight:700}span.num.lo{color:var(--lo);font-weight:700}
.loghead{display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--surf);color:var(--ink);font-weight:700}
.log{list-style:none;margin:0;padding:0;background:var(--surf);border:1px solid var(--line);border-radius:10px;max-height:460px;overflow:auto}
.log li{display:flex;gap:12px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:14px;border-left:3px solid transparent}
.log li.blue{border-left-color:var(--blue)}.log li.red{border-left-color:var(--red)}
.log li.k-fight,.log li.k-obj,.log li.k-nexus{font-weight:700}
.log time{color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.expl summary{cursor:pointer;color:var(--mut);font-size:14px;padding:8px 0}
.xl{list-style:none;margin:0;padding:0;font-size:13px;max-height:560px;overflow:auto;background:var(--surf);border:1px solid var(--line);border-radius:10px}
.xl li{padding:8px 12px;border-bottom:1px solid var(--line)}
.xh{display:flex;gap:10px}.xh time{color:var(--mut);flex:none}
.xf{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mut);margin:3px 0}
.xf em{font-style:normal;font-variant-numeric:tabular-nums}.xf em.pos{color:var(--hi)}.xf em.neg{color:var(--lo)}
.xr{font-variant-numeric:tabular-nums}
.teamhead p{margin:0;color:var(--mut)}
.tac{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 20px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px}
.tac label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.tac label span{display:flex;justify-content:space-between}
.tac output{font-variant-numeric:tabular-nums;font-weight:700}
.tac input[type=range]{accent-color:var(--brass);width:100%}
.tac select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px}
.roster tr[data-p]{cursor:pointer}.roster tr[data-p]:hover,.roster tr.open{background:var(--bg)}
.pdet{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px}
.pdet h3{color:var(--ink);font-size:20px}.pdet small{color:var(--mut);font-weight:400;font-size:13px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px 22px;margin-bottom:14px}
.arow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:2px 0;border-bottom:1px dotted var(--line)}
.bar{width:70px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brass)}
.pool,.champs,.mct{border:1px solid var(--line)}
.pip{display:inline-block;min-width:26px;text-align:center;border-radius:4px;padding:0 4px;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--brass) calc(var(--v)*8%),transparent)}
.mct th.bh{color:var(--blue)}.mct th.rh{color:var(--red)}
.mcb .score{font-size:clamp(40px,10vw,70px)}
.hist{display:flex;gap:6px;align-items:flex-end;height:140px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 12px 4px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.hist i{display:block;width:100%;background:var(--brass);border-radius:3px 3px 0 0;min-height:2px}
.hist span{font-size:11px;color:var(--mut);margin-top:3px}
textarea{width:100%;height:60vh;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink)}
@media (max-width:640px){.draft,.tstats{grid-template-columns:1fr}.tstat.red{justify-content:flex-start}.board{padding:14px 4px}.controls .primary{width:100%}}

.games{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.game{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.game.sel{border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.gn{font-weight:700}.gw{color:var(--mut);font-size:13px;text-align:right}
.gside{font-variant-numeric:tabular-nums}
.gp,.gm{grid-column:1/-1;font-size:12px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 6px;vertical-align:middle}.dot.blue{background:var(--blue)}.dot.red{background:var(--red)}
.gamedetail{scroll-margin-top:60px}
.seasonhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:6px 0 4px;border-bottom:3px solid var(--brass)}
.seasonhead h2{font-size:30px}.seasonhead p{margin:0;color:var(--mut)}
.nextm{text-align:right;display:flex;flex-direction:column;gap:2px}.nextm span{font-size:12px;color:var(--mut)}
.champ{text-align:right;display:flex;flex-direction:column}.champ span{font-size:12px;color:var(--mut)}.champ b{font:400 26px "Black Han Sans",sans-serif;color:var(--brass)}.champ small{color:var(--mut)}
.controls button:disabled{opacity:.5;cursor:default}
.tabs{margin:0 0 14px;width:max-content;max-width:100%;overflow-x:auto}
.stand tr.mine,table tr.mine{background:var(--blue-t)}
.stand tr.cut td{border-bottom:2px solid var(--brass)}
.form{display:flex;gap:3px}.form i{font-style:normal;font-size:11px;width:20px;text-align:center;border-radius:3px;padding:1px 0;background:var(--line);color:var(--mut)}.form i.W{background:var(--hi);color:var(--surf)}
.sched{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sched li{display:grid;grid-template-columns:150px 1fr;gap:6px 10px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.sched li.today{border-color:var(--brass)}
.sched li>button{grid-column:2}
.sched .sd{grid-row:span 4;display:flex;flex-direction:column;font-size:12px;color:var(--mut)}.sched time{color:var(--ink);font-variant-numeric:tabular-nums}
.sm{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:none;border:0;border-bottom:1px dotted var(--line);padding:4px 2px;cursor:pointer;text-align:left}
.sm:disabled{cursor:default;color:var(--mut)}
.sm span:last-child{text-align:right}.sm b{font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.sm .w,.bm .w{font-weight:700;color:var(--ink)}.sm.mine{box-shadow:inset 3px 0 0 var(--blue)}
.bracket{display:flex;gap:18px;align-items:center;min-width:max-content;padding:4px}
.bcol{display:flex;flex-direction:column;gap:12px;min-width:150px}
.bm{display:flex;flex-direction:column;gap:2px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;color:var(--mut)}
.bm:disabled{cursor:default}.bm span{display:flex;justify-content:space-between;gap:10px}
.bm.bye{cursor:default}.bm.bye small{font-size:11px}.bm.champ1{border-color:var(--brass)}
#overlay{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.55);display:flex;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#overlay[hidden]{display:none}
.ovin{background:var(--bg);width:100%;max-width:1100px;height:100%;overflow:auto;padding:0 16px 40px}
.ovhead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
body.lock{overflow:hidden}
@media (max-width:640px){.sched li{grid-template-columns:1fr}.sched li>button{grid-column:1}.sched .sd{grid-row:auto;flex-direction:row;gap:8px}.nextm,.champ{text-align:left}}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chips button{background:var(--surf);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--mut)}
.chips button[aria-pressed="true"]{border-color:var(--brass);color:var(--ink);font-weight:700}
.report{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px;border-top:3px solid var(--brass)}
.report h3{color:var(--ink)}.rx p{margin:0 0 4px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 24px;margin-top:10px}
.rgrid small{color:var(--mut)}.arow.minea{background:var(--blue-t)}
.news{list-style:none;margin:0;padding:0;background:var(--surf);border:1px solid var(--line);border-radius:10px}
.news li{display:flex;gap:12px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:14px}.news time{color:var(--mut);flex:none}
.warn{color:var(--lo);font-weight:700}
.titles{color:var(--brass);font-size:13px;margin:0 0 10px}

.cfgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-bottom:10px}
.cfgcard{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cfghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cfggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.cfggrid .full{grid-column:1/-1;margin:0}
.cfggrid label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut)}
.cfggrid input,.cfggrid select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:14px;color:var(--ink);min-width:0;width:100%}
.sm2{padding:4px 10px;font-size:12px}
.steps{list-style:none;display:flex;flex-wrap:wrap;gap:4px;margin:10px 0;padding:0;font-size:12px}
.steps li{padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.steps li.done{color:var(--ink);background:var(--surf)}.steps li.now{border-color:var(--brass);color:var(--ink);font-weight:700}
td.fmt{font-size:12px;color:var(--mut);white-space:normal;min-width:200px}
.rx h4{margin-top:4px}

.spark{width:90px;height:24px;flex:none}.spark polyline{fill:none;stroke:var(--brass);stroke-width:1.5}
.dec{font-size:13px;padding:5px 0;border-top:1px dotted var(--line)}.dec time{color:var(--mut)}.dec small{color:var(--mut)}

.fin{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.fin div{display:flex;flex-direction:column}.fin span{font-size:12px;color:var(--mut)}.fin b{font-size:20px;font-variant-numeric:tabular-nums}.fin b.neg{color:var(--lo)}.fin small{color:var(--mut);font-size:12px}

.tier{display:inline-block;min-width:22px;text-align:center;border-radius:4px;padding:0 4px;font-size:12px}
.tier.tS{background:var(--brass);color:var(--on-brass)}.tier.tA{background:var(--blue-t);color:var(--blue)}.tier.tB{background:var(--line)}.tier.tC,.tier.t-{color:var(--mut)}
.pnote{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.pnote summary{cursor:pointer}.pnote ul{margin:8px 0 0;padding-left:18px;font-size:14px}.pnote li{margin:2px 0}.pnote p{font-size:13px}
.market{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px;border-top:3px solid var(--blue)}
.market h3{color:var(--ink)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dotted var(--line);font-size:14px}
.mrow input{width:72px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--ink)}
.mrow select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px;color:var(--ink);margin:0 4px}
.msg{background:var(--blue-t);padding:8px 12px;border-radius:6px;font-weight:700}
.inl{flex-direction:row!important;align-items:center;gap:6px!important}
.inl select{padding:6px!important}
.stand tr.danger td{background:var(--red-t)}

.cfgcard.compact{padding:10px 12px}.cfgcard.compact p{margin:6px 0 0}.cfgcard.cur{border-color:var(--brass)}
.cfgcard .inl input{width:70px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--ink)}
.livebox{background:var(--surf);border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.livesc{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;font:400 22px "Black Han Sans",sans-serif;border-bottom:1px solid var(--line)}
.livesc .bl{color:var(--blue)}.livesc .rd{color:var(--red)}.livesc time{font:500 13px "IBM Plex Sans KR",sans-serif;color:var(--mut)}
#ll{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}#ll li{display:flex;gap:10px;padding:5px 12px;border-bottom:1px solid var(--line);font-size:14px;border-left:3px solid transparent;animation:fadein .3s}
#ll li.blue{border-left-color:var(--blue)}#ll li.red{border-left-color:var(--red)}#ll time{color:var(--mut)}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}

.chapters{display:grid;gap:6px;margin:12px 0}
.chap{background:var(--surf);border:1px solid var(--line);border-radius:10px;margin:0}
.chap.now{border-color:var(--brass)}.chap.done .chaphead b{color:var(--mut)}
.chaphead{width:100%;display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:10px 12px;cursor:pointer;text-align:left}
.chaphead .cn{font:400 16px "Black Han Sans",sans-serif;color:var(--brass);min-width:34px}.chaphead small{margin-left:auto;color:var(--mut);white-space:nowrap}

주는 피해량이 8% 증가합니다."},"8021":{"id":"8021","key":"FleetFootwork","nameKo":"기민한 발놀림","styleId":"8000","styleKey":"Precision","styleNameKo":"정밀","slot":0,"shortDescKo":"공격 및 이동 시 충전. 충전 중첩 100회 상태로 공격 시 체력 회복 및 이동 속도 증가","longDescKo":"공격 또는 이동 시 충전 중첩이 쌓입니다. 중첩이 100회에 도달하면 충전 상태로 다음 공격을 할 수 있습니다. 충전 상태로 공격 시 15~160(+추가 공격력의 0.1, +주문력의 0.05)에 해당하는 체력이 회복되며 1초 동안 이동 속도가 20% 증가합니다. 원거리 챔피언의 경우 회복 효과 60%, 이동 속도 효과 75%가 적용됩니다. 미니언을 대상으로는 모든 회복 효과가 15%만 적용됩니다."},"8105":{"id":"8105","key":"RelentlessHunter","nameKo":"끈질긴 사냥꾼","styleId":"8100","styleKey":"Domination","styleNameKo":"지배","slot":3,"shortDescKo":"적 챔피언당 1회 한정 처치 관여 시 전투에서 벗어나 있을 때 이동 속도 영구 증가","longDescKo":"전투에서 벗어나 있을 때 이동 속도가 8 상승합니다. 현상금 사냥꾼 중첩 하나당 증가합니다. 각 적 챔피언을 처치하는 데 처음으로 관여할 때마다 현상금 사냥꾼 중첩을 얻을 수 있습니다."},"8106":{"id":"8106","key":"UltimateHunter","nameKo":"궁극의 사냥꾼","styleId":"8100","styleKey":"Domination","styleNameKo":"지배","slot":3,"shortDescKo":"적 챔피언당 1회 한정 처치 관여 시 궁극기 재사용 대기시간 영구 감소","longDescKo":"궁극기의 스킬 가속이 6, 추가로 현상금 사냥꾼 중첩 1회당 5 증가합니다. 각 적 챔피언을 처치하는 데 처음으로 관여할 때마다 현상금 사냥꾼 중첩을 얻을 수 있습니다."},"8112":{"id":"8112","key":"Electrocute","nameKo":"감전","styleId":"8100","styleKey":"Domination","styleNameKo":"지배","slot":0,"shortDescKo":"3초 동안 같은 챔피언에게 기본 공격 또는 개별 스킬 3회를 적중시키면 추가 적응형 피해 적용","longDescKo":"3초 동안 같은 챔피언에게 개별 공격 또는 스킬을 3회 적중시키면 추가 적응형 피해를 입힙니다. 피해량: 70~240(+추가 공격력의 0.1, +주문력의 0.05) 재사용 대기시간: 20초 '우리는 그들을 천둥군주라고 부른다. 그들의 번개를 입에 올리는 것은 재앙을 부르는 길이기 때문이다.'"},"8126":{"id":"8126","key":"CheapShot","nameKo":"비열한 한 방","styleId":"8100","styleKey":"Domination","styleNameKo":"지배","slot":1,"shortDescKo":"이동 또는 행동이 제약된 적 챔피언에게 추가 고정 피해","longDescKo":"이동 또는 행동을 방해받은 상태의 챔피언에게 피해를 주면 레벨에 따라 10 ~ 45의 추가 고정 피해를 입힙니다. 재사용 대기시간: 4초 방해 효과 이후 피해를 가할 때 활성화됩니다."},"8128":{"id":"8128","key":"DarkHarvest","nameKo":"어둠의 수확","styleId":"8100","styleKey":"Domination","styleNameKo":"지배","slot":0,"shortDescKo":"체력이 낮은 챔피언에게 피해를 입히면 적응형 피해를 입히고 해당 챔피언의 영혼을 수확","longDescKo":"체력이 50%보다 낮은 챔피언에게 피해를 입히면 적응형 피해를 입히고 해당 챔피언의 영혼을 수확해 어둠의 수확 효과의 피해량이 영구적으로 11만큼 증가합니다. 어둠의 수확 피해량: 30(+영혼당 피해량 11)(+추가 공격력의 0.1)(+주문력의 0.05) 재사용 대기시간: 35초 (처치 관여 시 1.0초로 초기화)"},"8135":{"id":"8135","key":"TreasureHunter","nameKo":"보물 사냥꾼","styleId":"8100","styleKey":"Domination","styleNameKo":"지배","slot":3,"shortDescKo":"고유 처치 관여 시 처음으로 획득하는 골드량 증가","longDescKo":"다음번 현상금 사냥꾼 중첩을 획득하면 50골드를 추가로 얻습니다. 현상금 사냥꾼 중첩 하나당 골드 획득량이 20골드씩 증가합니다. (최대 130골드) 각 적 챔피언을 처치하는 데 처음으로 관여할 때마다 현상금 사냥꾼 중첩을 얻을 수 있습니다."},"8137":{"id":"8137","key":"SixthSense","nameKo":"육감","styleId":"8100","styleKey":"Domination","styleNameKo":"지배","slot":2,"shortDescKo":"주변의 미추적 상태인 보이지 않는 와드를 자동으로 감지하여 추적합니다. 재사용 대기시간이 깁니다. 11레벨: 10초 동안 와드를 드러냅니다.","longDescKo":"주변의 미추적 상태인 보이지 않는 와드를 자동으로 감지하여 추적합니다. 11레벨: 10초 동안 와드를 드러냅니다. 이 효과에는 250초의 재사용 대기시간이 적용됩니다."},"8139":{"id":"8139","key":"TasteOfBlood","nameKo":"피의 맛","styleId":"8100","styleKey":"Domination","styleNameKo":"지배","slot":1,"shortDescKo":"적 챔피언에게 피해를 입히면 체력을 회복합니다.","longDescKo":"적 챔피언에게 피해를 입히면 체력을 회복합니다. 회복량: 16 ~ 40 (+추가 공격력의 0.1, +주문력의 0.05) (레벨에 비례) 재사용 대기시간: 20초"},"8140":{"id":"8140","key":"GrislyMementos","nameKo":"섬뜩한 기념품","styleId":"8100","styleKey":"Domination","styleNameKo":"지배","slot":2,"shortDescKo":"챔피언 처치 관여 시 기념품을 1개 획득합니다. (최대 18개) 수집한 기념품 하나당 장신구 가속이 6 증가합니다.","longDescKo":"챔피언 처치 관여 시 기념품을 1개 획득합니다. (최대 18개) 수집한 기념품 하나당 장신구 가속이 6 증가합니다. 시야 장신구가 없는 게임 모드에서는 소환사 주문 가속이 3 증가합니다."},"8141":{"id":"8141","key":"DeepWard","nameKo":"깊은 와드","styleId":"8100","styleKey":"Domination","styleNameKo":"지배","slot":2,"shortDescKo":"적 정글에 설치한 와드가 깊은 상태가 되어 체력과 지속시간이 증가합니다. 9레벨: 강에 설치한 와드 또한 깊은 상태가 됩니다.","longDescKo":"적 정글에 설치한 와드가 깊은 상태가 됩니다. 깊은 와드의 체력이 1, 지속시간이 [30 - 45]초 증가합니다. (장신구 투명 와드의 경우 [45 - 150]초 증가) 9레벨: 강에 설치한 와드 또한 깊은 상태가 됩니다."},"8143":{"id":"8143","key":"SuddenImpact","nameKo":"돌발 일격","styleId":"8100","styleKey":"Domination","styleNameKo":"지배","slot":1,"shortDescKo":"돌진, 도약, 점멸, 순간이동을 사용하거나 은신에서 빠져나온 후 적 챔피언에게 기본 공격과 스킬로 피해를 입히면 추가 고정 피해","longDescKo":"돌진, 도약, 점멸, 순간이동을 사용하거나 은신에서 빠져나온 후 4초 동안 적 챔피언에게 기본 공격과 스킬로 피해를 입히면 레벨에 비례해 20~80의 추가 고정 피해를 입힙니다. 재사용 대기시간: 10초"},"8210":{"id":"8210","key":"Transcendence","nameKo":"깨달음","styleId":"8200","styleKey":"Sorcery","styleNameKo":"마법","slot":2,"shortDescKo":"다음 레벨이 되면 추가 효과 획득: 5레벨: 스킬 가속 +5 8레벨: 스킬 가속 +5 11레벨: 챔피언 처치 관여 시 기본 스킬의 남은 재사용 대기시간 20% 감소","longDescKo":"다음 레벨이 되면 추가 효과 획득: 5레벨: 스킬 가속 +5 8레벨: 스킬 가속 +5 11레벨: 챔피언 처치 관여 시 기본 스킬의 남은 재사용 대기시간 20% 감소"},"8214":{"id":"8214","key":"SummonAery","nameKo":"콩콩이 소환","styleId":"8200","styleKey":"Sorcery","styleNameKo":"마법","slot":0,"shortDescKo":"공격 또는 스킬 사용 시 대상에 콩콩이를 보내 적에게 피해를 주거나 아군에게 보호막 생성","longDescKo":"적 챔피언을 기본 공격 또는 스킬로 공격하면 콩콩이를 보내 레벨에 따라 10~50(+주문력의 0.05)(+추가 공격력의 0.1)만큼 피해를 입힙니다. 아군에게 스킬로 강화 효과 또는 보호막을 적용하면 콩콩이를 보내 레벨에 따라 20~100(+주문력의 0.05)(+추가 공격력의 0.1)만큼 피해를 흡수하는 보호막을 씌웁니다. 콩콩이는 자신에게 돌아오기 전까지 다른 대상에게 보낼 수 없습니다."},"8224":{"id":"8224","key":"NullifyingOrb","nameKo":"액시옴 비전 마법사","styleId":"8200","styleKey":"Sorcery","styleNameKo":"마법","slot":1,"shortDescKo":"궁극기의 피해량, 체력 회복 및 보호막 효과가 증가했습니다. 적 챔피언 처치에 관여하면 궁극기의 현재 재사용 대기시간이 감소합니다.","longDescKo":"궁극기의 피해량과 체력 회복량, 보호막 흡수량이 12% 증가합니다. (광역 피해량은 8% 증가) 적 챔피언 처치에 관여하면 궁극기의 현재 재사용 대기시간이 7% 감소합니다."},"8226":{"id":"8226","key":"ManaflowBand","nameKo":"마나순환 팔찌","styleId":"8200","styleKey":"Sorcery","styleNameKo":"마법","slot":1,"shortDescKo":"적 챔피언에게 스킬을 적중하면 최대 마나가 영구적으로 25만큼 증가합니다. (최대 마나량: 250) 최대 마나량 250에 도달하면 5초마다 잃은 마나의 1%를 회복합니다.","longDescKo":"적 챔피언에게 스킬을 적중하면 최대 마나가 영구적으로 25만큼 증가합니다. (최대 마나량: 250) 최대 마나량 250에 도달하면 5초마다 잃은 마나의 1%를 회복합니다. 재사용 대기시간: 15초"},"8229":{"id":"8229","key":"ArcaneComet","nameKo":"신비로운 유성","styleId":"8200","styleKey":"Sorcery","styleNameKo":"마법","slot":0,"shortDescKo":"챔피언에게 스킬로 피해를 주면 해당 위치에 피해를 가하는 유성 소환","longDescKo":"챔피언에게 스킬로 피해를 입히면 해당 위치에 유성을 불러옵니다. 유성이 이동한 거리에 따라 피해량이 증가합니다. 적응형 피해: 레벨에 따라 15~100 (+주문력의 0.05 및 +추가 공격력의 0.1) 재사용 대기시간: 20~8초 750거리일 때 피해량이 최대 100% 증폭됩니다."},"8230":{"id":"8230","key":"PhaseRush","nameKo":"폭풍전사의 포효","styleId":"8200","styleKey":"Sorcery","styleNameKo":"마법","slot":0,"shortDescKo":"챔피언 최대 체력의 25%에 해당하는 피해를 입힐 시 이동 속도 및 둔화 저항 대폭 증가","longDescKo":"3초 안에 챔피언 최대 체력의 25%에 해당하는 피해를 입히면 4초 동안 이동 속도가 48%, 둔화 저항이 50% 증가합니다. 원거리 챔피언은 이동 속도 증가 효과가 75%만 적용됩니다. 재사용 대기시간: 20~10초"},"8232":{"id":"8232","key":"Waterwalking","nameKo":"물 위를 걷는 자","styleId":"8200","styleKey":"Sorcery","styleNameKo":"마법","slot":3,"shortDescKo":"강에 있을 때 이동 속도를 얻고 적응형으로 주문력 또는 공격력 증가","longDescKo":"강에 있을 때 이동 속도가 10 증가하고 레벨에 비례하여 13~30의 적응형 능력치를 얻습니다. 굽이치는 강물처럼 빠르고 깜짝 놀란 협곡 바위 게처럼 날렵하게 움직이리라."},"8233":{"id":"8233","key":"AbsoluteFocus","nameKo":"절대 집중","styleId":"8200","styleKey":"Sorcery","styleNameKo":"마법","slot":2,"shortDescKo":"체력이 70% 이상일 경우 적응형 피해 추가 적용","longDescKo":"체력이 70% 이상일 경우 레벨에 따라 적응형으로 추가 공격력 최대 18 또는 추가 주문력 최대 30의 효과를 얻습니다. 1레벨에 1.8의 공격력 또는 3의 주문력을 얻습니다."},"8234":{"id":"8234","key":"Celerity","nameKo":"기민함","styleId":"8200","styleKey":"Sorcery","styleNameKo":"마법","slot":2,"shortDescKo":"모든 추가 이동 속도 효과가 7% 증가하고 이동 속도 1% 증가","longDescKo":"모든 추가 이동 속도 효과가 7% 증가하고 이동 속도를 1% 추가로 얻습니다."},"8236":{"id":"8236","key":"GatheringStorm","nameKo":"폭풍의 결집","styleId":"8200","styleKey":"Sorcery","styleNameKo":"마법","slot":3,"shortDescKo":"게임이 진행됨에 따라 적응형 공격력 또는 주문력 획득량 증가","longDescKo":"10분마다 적응형 주문력 또는 공격력을 얻습니다. 10분: + 주문력 8 또는 공격력 5 20분: + 주문력 24 또는 공격력 14 30분: + 주문력 48 또는 공격력 29 40분: + 주문력 80 또는 공격력 48 50분: + 주문력 120 또는 공격력 72 60분: + 주문력 168 또는 공격력 101 등등..."},"8237":{"id":"8237","key":"Scorch","nameKo":"주문 작열","styleId":"8200","styleKey":"Sorcery","styleNameKo":"마법","slot":3,"shortDescKo":"10초마다 공격 스킬 적중 시 챔피언을 불태움","longDescKo":"다음 공격 스킬 적중 시 챔피언에게 불을 붙여 1초 후 레벨에 따라 20~40의 추가 마법 피해를 줍니다. 재사용 대기시간: 10초"},"8242":{"id":"8242","key":"Unflinching","nameKo":"불굴의 의지","styleId":"8400","styleKey":"Resolve","styleNameKo":"결의","slot":3,"shortDescKo":"군중 제어 스킬에 영향을 받을 때 방어력과 마법 저항력이 증가합니다.","longDescKo":"군중 제어 스킬에 영향을 받을 때와 그 이후 2초 동안 방어력과 마법 저항력이 10 증가합니다."},"8275":{"id":"8275","key":"NimbusCloak","nameKo":"빛의 망토","styleId":"8200","styleKey":"Sorcery","styleNam // ===== LOL GM: 코어 엔진 =====
function clamp(v,a,b){return v<a?a:v>b?b:v}
function avg(a){return a.length?a.reduce((s,x)=>s+x,0)/a.length:0}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
class RNG{
  constructor(seed,name){this.a=hashStr(String(seed)+'::'+name)|0;this.sp=null}
  next(){let a=this.a=(this.a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return ((t^(t>>>14))>>>0)/4294967296}
  r(){return this.next()}
  range(a,b){return a+(b-a)*this.next()}
  chance(p){return this.next()<p}
  normal(m=0,s=1){if(this.sp!==null){const z=this.sp;this.sp=null;return m+s*z}const u=1-this.next(),v=this.next(),r=Math.sqrt(-2*Math.log(u));this.sp=r*Math.sin(2*Math.PI*v);return m+s*r*Math.cos(2*Math.PI*v)}
  pick(arr){return arr[Math.floor(this.next()*arr.length)]}
  int(a,b){return a+Math.floor(this.next()*(b-a+1))}
}
// 원인별로 분리된 랜덤 스트림
function makeStreams(seed){return {mech:new RNG(seed,'mechanical'),dec:new RNG(seed,'decision'),info:new RNG(seed,'information'),exec:new RNG(seed,'execution'),draft:new RNG(seed,'draft'),log:new RNG(seed,'log')}}

// 포지션별 주전은 Depth Chart에 고정한다. 지정 선수가 이탈한 경우에만 자동 보충한다.
function starterFor(db,team,role){
  if(!team)return null;team.depthChart=team.depthChart||{};
  const id=team.depthChart[role],fixed=id&&db.players[id];
  if(fixed&&fixed.team===team.id&&(team.roster||[]).includes(id)&&fixed.role===role)return fixed;
  let best=null,bo=-1;for(const pid of team.roster||[]){const p=db.players[pid];if(!p||p.role!==role)continue;const o=playerOvr(p);if(o>bo){bo=o;best=p}}
  if(best)team.depthChart[role]=best.id;else delete team.depthChart[role];
  return best;
}

// ---------- 챔피언 평가 (패치 원수치 기반) ----------
function championSkillProfile(c){
  const ss=Object.values(c.skills||{}),n=Math.max(1,ss.length),effects=ss.flatMap(s=>s.effects||[]);
  const structured=ss.filter(s=>(s.baseDamage&&s.baseDamage.length)||Object.keys(s.ratios||{}).length||s.cc||s.heal||s.shield);
  const avgNum=(arr,def=0)=>{const v=(arr||[]).map(Number).filter(Number.isFinite);return v.length?avg(v):def};
  const dmg=structured.reduce((z,s)=>z+avgNum(s.baseDamage)/500,0)/n,ratio=structured.reduce((z,s)=>z+Object.values(s.ratios||{}).reduce((a,b)=>a+(Number(b)||0),0),0)/n;
  const dmgMod=avg(ss.map(s=>s.damageMod??1)),utilityMod=avg(ss.map(s=>s.utilityMod??1)),ccMod=avg(ss.map(s=>s.ccMod??1)),mobilityMod=avg(ss.map(s=>s.mobilityMod??1));
  const healMod=avg(ss.map(s=>s.healMod??1)),shieldMod=avg(ss.map(s=>s.shieldMod??1));
  const cds=ss.map(s=>Number(s.cooldown)).filter(x=>Number.isFinite(x)&&x>0),ranges=ss.flatMap(s=>(s.range||[]).map(Number)).filter(x=>Number.isFinite(x)&&x>=100&&x<5000),costs=ss.flatMap(s=>(s.cost||[]).map(Number)).filter(x=>Number.isFinite(x)&&x>0);
  const uptime=clamp(cds.reduce((z,x)=>z+1/x,0)*2.2,0,1.25),reach=clamp((avgNum(ranges,450)-300)/900,0,1),economy=costs.length?clamp(1-avgNum(costs)/230,.62,1):1;
  const ccStructured=structured.reduce((z,s)=>z+(s.cc?(s.cc.duration||1):0),0)/n,utilStructured=structured.filter(s=>s.heal||s.shield).length/n;
  return {
    power:clamp((ss.reduce((z,s)=>z+(s.power||0),0)/n/10+dmg*.18+ratio*.08)*dmgMod,0,1.7),
    uptime:clamp(uptime*(2-dmgMod*.15),0,1.35),
    cc:clamp((effects.filter(x=>x==='cc'||x==='engage').length/n+ccStructured*.5)*ccMod,0,1.7),

// ---------- 밴픽 ----------
const VHAT_NOISE={};
// 진영·픽 순서 균형 계수 (블루/레드, 선픽/후픽 승률을 50%에 맞추도록 튜닝)
const BAL={blue:0.025,counter:0.1,first:0.013};
const DRAFT_ORDER=[['B',0],['B',1],['B',0],['B',1],['B',0],['B',1],['P',0],['P',1],['P',1],['P',0],['P',0],['P',1],['B',1],['B',0],['B',1],['B',0],['P',1],['P',0],['P',0],['P',1]];
function runDraft(db, teamIds, rng, ctx){
  ctx=ctx||{used:[],byTeam:{}};
  const champs=Object.values(db.patch.champions).filter(c=>championAvailableForContext(db,c,ctx));
  const strengths={}; champs.forEach(c=>strengths[c.id]=champStrength(c,db.patch));
  const vals=Object.values(strengths), mn=Math.min(...vals), mx=Math.max(...vals);
  if(ctx.forced){const f=ctx.forced;return {bans:f.bans,picks:f.picks,log:[],expl:[{t:0,title:'기록된 밴픽 재현',factors:[],result:''}]}}
  // 팀별 메타 인식값 V_hat = 패치 직후의 사전 추정(분석력에 따라 오차) + 대회 데이터 관찰(표본이 쌓일수록 비중 증가)
  const MS=db.metaStats||{}, G=db.metaGames||0, RMS=db.regionMetaStats||{}, RMG=db.regionMetaGames||{};
  const vhat=teamIds.map(tid=>{const team=db.teams[tid],rid=team.region,an=Math.min(1,team.coach.analysis/100+scrimAnalysisBonus(team)); const m={};
    const nk=tid+'|'+db.patch.id+'|'+an; const NZ=VHAT_NOISE[nk]||(VHAT_NOISE[nk]=Object.fromEntries(champs.map(c=>[c.id,((hashStr(tid+db.patch.id+c.id)%2000)/1000-1)*0.35*(1.1-an)])));
    champs.forEach(c=>{const noise=NZ[c.id];
      let v=clamp((strengths[c.id]-mn)/(mx-mn||1)+noise,0,1);
      const gst=MS[c.id],rst=(RMS[rid]||{})[c.id],rg=RMG[rid]||0,know=((team.metaKnowledge||{})[c.id]||0),counter=((team.metaCounter||{})[c.id]||0);
      const observe=(base,st,g,weight)=>{if(!st||!g)return base;const n=st.p+st.b,w=n/(n+18*(1.35-an)),wr=(st.w+2)/(st.p+4),obs=clamp(0.5+(wr-0.5)*2.2+(n/g)*0.5-0.1,0,1);return base*(1-w*weight)+obs*w*weight};
      v=observe(v,gst,G,.45);v=observe(v,rst,rg,.75);const prePro=c.proEligibleDate&&!championProEligible(db,c),uncertainty=prePro?(know-.5)*.12:0;v=clamp(v+know*.08-counter*.035+uncertainty,0,1);
      m[c.id]=v}); return m});
  const roster=teamIds.map(tid=>{const r={}; ROLES.forEach(role=>r[role]=starterFor(db,db.teams[tid],role)); return r});
  const taken=new Set(ctx.fearless?ctx.used:[]), bans=[[],[]], picks=[{},{}], expl=[];
  const mastery=(p,c)=>p.pool[c]?p.pool[c].mastery:25;
  const byRole={};ROLES.forEach(r=>byRole[r]=champs.filter(c=>c.roles.includes(r)));
  const tacs=teamIds.map(t=>db.teams[t].tactics);
  function pickValue(side,role,c,mine){
    const p=roster[side][role], ch=db.patch.champions[c], t=tacs[side];
    let comp=0;
    const maxEng=mine.reduce((m,x)=>Math.max(m,x.kit.engage),0); if(maxEng<7) comp+=ch.kit.engage/10*0.5;
    if(!mine.some(x=>x.cls==='tank')&&ch.cls==='tank') comp+=0.35;
    if(mine.length>=2){const ap=mine.filter(x=>x.dmg==='AP').length, ad=mine.length-ap; if(ap===0&&ch.dmg==='AP')comp+=0.3; if(ad===0&&ch.dmg==='AD')comp+=0.3;}
    const scal=(t.scaling_preference-50)/50; comp+=scal*(ch.kit.late-ch.kit.early)/10*0.4;
    const enemy=picks[1-side][role]; let counter=0;
    if(enemy){const e=db.patch.champions[enemy]; counter=((ch.kit.early-e.kit.early)+(ch.kit.poke-e.kit.poke)*0.5)/10*0.5;}
    const flex=ch.roles.length>1?0.04:0;
    const hist=ctx.byTeam[teamIds[side]]||{won:[],lost:[]};
    const series=(hist.won.includes(c)?0.03:0)-(hist.lost.includes(c)?0.06:0);
    const f={meta:vhat[side][c]*0.35, mastery:mastery(p,c)/100*0.5, comp:comp*0.15, counter:counter*BAL.counter, flex, series};

  const SL={};
  function shortlist(side,r){const k=side+r;if(SL[k])return SL[k].filter(c=>!taken.has(c.id)).slice(0,10);
    const p=roster[side][r];SL[k]=byRole[r].map(c=>({c,q:vhat[side][c.id]*0.35+mastery(p,c.id)/200})).sort((a,b)=>b.q-a.q).map(x=>x.c);return SL[k].filter(c=>!taken.has(c.id)).slice(0,10)}
  const log=[];
  const fp=ctx.firstPick||0; // 선픽 팀(진영과 별개)
  for(const [kind,ord] of DRAFT_ORDER){ const side=ord===0?fp:1-fp;
    const tn=db.teams[teamIds[side]], noise=0.08*(1.1-tn.coach.draft/100);
    if(kind==='P'){
      const open=ROLES.filter(r=>!picks[side][r]), mine=Object.values(picks[side]).map(n=>db.patch.champions[n]); let best=null;
      for(const r of open) for(const c of shortlist(side,r)){ if(taken.has(c.id)) continue;
        const f=pickValue(side,r,c.id,mine); const v=f.total+(rng.next()-0.5)*noise*3.46; if(!best||v>best.v) best={v,r,c:c.id,f}; }
      if(!best){ const r=open[0], c=champs.find(x=>!taken.has(x.id)); best={v:0,r,c:c.id,f:{total:0}}; }

      expl.push({t:0,title:`${tn.short} 픽: ${championLabel(db,best.c)} (${ROLE_KO[best.r]})`,factors:[['메타 인식',best.f.meta],['숙련도',best.f.mastery],['조합',best.f.comp],['상성',best.f.counter],['유연성',best.f.flex],['시리즈 경험',best.f.series||0]],utility:best.v,result:'PICK'});
    } else {
      const opp=1-side, open=ROLES.filter(r=>!picks[opp][r]), mine=Object.values(picks[opp]).map(n=>db.patch.champions[n]); let best=null;
      const avail={};ROLES.forEach(R=>avail[R]=byRole[R].filter(x=>!taken.has(x.id)).length);
      const need={};ROLES.forEach(R=>need[R]=[0,1].filter(i=>!picks[i][R]).length);
      const safe=c=>c.roles.every(R=>avail[R]-1>=need[R]+1);
      const oh=ctx.byTeam[teamIds[opp]];
      for(const r of open) for(const c of shortlist(opp,r)){ if(taken.has(c.id)||!safe(c)) continue;

      if(!best) continue;
      bans[side].push(best.c); taken.add(best.c);
      log.push({kind,side,champ:best.c,role:best.r,player:roster[opp][best.r].name});
      expl.push({t:0,title:`${tn.short} 밴: ${championLabel(db,best.c)} (상대 ${ROLE_KO[best.r]} ${roster[opp][best.r].name} 견제)`,factors:[['상대 픽 가치',best.f.total],['이전 세트 활약',best.f.reveal]],utility:best.v,result:'BAN'});
    }

}

function systemEffects(defs,ids){
  const out=Object.fromEntries((typeof SYSTEM_EFFECT_KEYS!=='undefined'?SYSTEM_EFFECT_KEYS:['offense','defense','sustain','utility','haste','mobility','early','scaling']).map(k=>[k,0]));

  return out;
}
function systemChoiceScore(c,e,role){
  const k=c.kit||{},front=['fighter','tank'].includes(c.cls),support=role==='SUP'||c.cls==='enchanter';
  return (e.offense||0)*(.8+(k.burst+k.dps)/16)+(e.defense||0)*(front?1.35:.75)+(e.sustain||0)*(.7+(k.sustain||5)/8)+(e.utility||0)*(support?1.5:.7)+(e.haste||0)*(.8+(k.cc+k.poke)/18)+(e.mobility||0)*(.75+(k.mobility||5)/8)+(e.early||0)*(.65+(k.early||5)/8)+(e.scaling||0)*(.65+(k.late||5)/8);
}
function selectItemBuild(patch,c,p,role){
  const pool=(patch.items&&patch.items[c.cls]||[]).filter(id=>patch.itemDefs&&patch.itemDefs[id]&&patch.itemDefs[id].active!==false&&patch.itemDefs[id].shopActive!==false);
  const ranked=pool.map(id=>{const d=patch.itemDefs[id],noise=((hashStr((p&&p.id||'')+'|'+c.id+'|'+role+'|'+id)%1000)/1000-.5)*.012;return {id,tier:d.tier,s:systemChoiceScore(c,d.effects||{},role)+noise-(d.cost||3000)/140000+(d.tier==='boots'?.006:0)}}).sort((x,y)=>y.s-x.s);

}

function itemPurchasePlan(patch,finalBuild,starterId){

function runeChoiceScore(patch,c,p,role,id){

function selectRunePage(patch,c,p,role){

  if(styles.length<2)return [];

const at=(ps,a)=>ps.p.attrs[a]/100;

function newPS(p,side,role,champ,patch){

function alive(st,ps){return ps.deadUntil<=st.t}

function combatStats(st,ps){
  const sd=st.sides[ps.side], key=st.t*1e6+ps.goldEarned*10+ps.lvl+(sd.baronUntil>st.t?0.1:0)+(sd.elderUntil>st.t?0.2:0)+(sd.soul?0.4:0);

function power(st,ps){const c=combatStats(st,ps);return Math.sqrt(c.off*c.ehp)}

function fmtTime(m,sec){return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function log(st,text,opt={}){if(st.quiet)return;if(opt.sec===undefined)st.cur=Math.min(59,st.cur+st.rng.log.int(2,7));st.log.push({t:st.t,sec:opt.sec??st.cur,text,side:opt.side??-1,major:!!opt.major,kind:opt.kind||''})}

}

function killPlayer(st,killer,victim,assists,reason){
  const R=st.patch.rules;
  victim.d++; victim.hp=1;
  const sec=victim.lvl*2.5+6+Math.max(0,st.t-15)*0.9;
  victim.deadUntil=st.t+sec/60; victim.penalty=Math.min(1,(sec+25)/60);
  if(killer){killer.k++; addGold(killer,R.killGold); addXp(killer,140+victim.lvl*20); st.sides[killer.side].kills++;}
  const as=assists.filter(a=>a!==killer&&a.side!==victim.side);
  as.forEach(a=>{a.a++; addGold(a,Math.round(R.assistGold/as.length)); addXp(a,70)});

  log(st,`${killer?pname(st,killer):'처형'} → ${pname(st,victim)} 처치${fb?' (퍼스트 블러드)':''}${reason?' · '+reason:''}`,{side:killer?killer.side:1-victim.side,major:true,kind:'kill'});
}

// ----- 교전: Setup → Engage → Burst → Extended → Cleanup -----
function fight(st,zone,sideArrs,ctx={}){
  const R=st.rng;
  if(!sideArrs[0].length||!sideArrs[1].length) return null;
  const vis=st.vision[zone]||0,isTeamfight=sideArrs[0].length+sideArrs[1].length>=6;
  const initScore=[0,1].map(i=>{const a=sideArrs[i];
    return avg(a.map(p=>(at(p,'anticipation')+at(p,'map_awareness')+at(p,'teamfight_awareness'))/3))*1.0
      +(i===0?vis:-vis)*0.4 +(i===0?BAL.blue:0)+ Math.max(...a.map(p=>p.champ.kit.engage))/10*0.25 + (a.length-sideArrs[1-i].length)*0.12 + R.info.normal(0,0.15)});
  const init=initScore[0]>=initScore[1]?0:1, def=1-init;
  const engager=sideArrs[init].reduce((b,p)=>p.champ.kit.engage*at(p,'engage')>b.champ.kit.engage*at(b,'engage')?p:b);
  const defAvoid=avg(sideArrs[def].map(p=>(at(p,'dodging')+at(p,'positioning'))/2));
  const engP=clamp(0.3+0.45*engager.champ.kit.engage/10*at(engager,'engage')+0.25*(initScore[init]-initScore[def])-0.35*(defAvoid-0.6),0.08,0.92);
  const engOk=R.exec.chance(engP);
  const mult=[1,1]; mult[init]*=engOk?1.2:0.9; if(!engOk) mult[def]*=1.05;
  if(ctx.defender!==undefined) mult[ctx.defender]*=1.15;
  const F=[];
  for(const i of [0,1]) for(const ps of sideArrs[i]){const cs=combatStats(st,ps);F.push({ps,side:i,max:cs.ehp,hp:cs.ehp*clamp(ps.hp,0.2,1),off:cs.off,alive:true,hitters:new Set(),last:null})}
  const K=(avg(F.map(f=>f.max))/avg(F.map(f=>f.off)))/4.6;
  const peel=[0,1].map(i=>avg(sideArrs[i].map(p=>p.champ.kit.peel/10*at(p,'peeling'))));
  const pw0=[0,1].map(i=>F.filter(f=>f.side===i).reduce((s,f)=>s+Math.sqrt(f.off*f.hp),0)*mult[i]);
  const rounds=['burst','ext','ext','ext','clean'];
  let disengaged=-1;
  for(let ri=0;ri<rounds.length;ri++){
    const rd=rounds[ri];
    const liv=[0,1].map(i=>F.filter(f=>f.side===i&&f.alive));
    if(!liv[0].length||!liv[1].length)break;
    if(ri>=1&&rd!=='clean'){
      const pw=[0,1].map(i=>liv[i].reduce((s,f)=>s+Math.sqrt(f.off*f.hp),0)*mult[i]);
      const lose=pw[0]<pw[1]?0:1;
      if(pw[lose]/pw[1-lose]<0.6){const dk=avg(liv[lose].map(f=>f.ps.champ.kit.disengage/10*at(f.ps,'disengage')));
        if(R.exec.chance(0.15+0.5*dk)){disengaged=lose;break;}}
    }
    const dmgs=[];
    for(const f of F){ if(!f.alive)continue;
      const en=F.filter(e=>e.side!==f.side&&e.alive); if(!en.length)continue;
      let tgt;
      if(R.dec.chance(0.35+0.55*at(f.ps,'target_selection'))){
        tgt=en.reduce((b,e)=>{const s=(e.off/e.hp)*(1.3-0.6*at(e.ps,'positioning'));return !b||s>b.s?{e,s}:b},null).e;
      } else tgt=R.dec.chance(0.5)?en.reduce((b,e)=>e.hp>b.hp?e:b):R.dec.pick(en);
      const k=f.ps.champ.kit;
      const w=rd==='burst'?0.55+0.09*k.burst:rd==='ext'?0.4+0.07*k.dps:0.5;
      const execRoll=Math.max(0.3,R.mech.normal(1,0.13*(1.25-at(f.ps,'consistency'))));
      let d=f.off*K*w*execRoll*mult[f.side];
      if(['ADC','MID'].includes(tgt.ps.role)) d*=1-0.3*peel[tgt.side];
      dmgs.push([f,tgt,d]);
    }
    for(let i=dmgs.length-1;i>0;i--){const j=Math.floor(R.mech.next()*(i+1));[dmgs[i],dmgs[j]]=[dmgs[j],dmgs[i]]}
    for(const [f,t,d] of dmgs){if(t.hp<=0)continue;const dealt=Math.round(d*.9);t.hp-=d;t.hitters.add(f);f.ps.dmg+=dealt;t.ps.dmgTaken+=dealt;if(isTeamfight)f.ps.teamfightDmg+=dealt;if(t.hp<=0)t.last=f;}
    for(const t of F) if(t.alive&&t.hp<=0){t.alive=false;}
    if(rd==='clean')break;
  }
  const deaths=[0,0];
  for(const f of F){
    if(!f.alive){deaths[f.side]++; killPlayer(st,f.last?f.last.ps:null,f.ps,[...f.hitters].map(h=>h.ps),ctx.label||'')}
    else f.ps.hp=clamp(f.hp/f.max,0.05,1);
  }
  const sur=[0,1].map(i=>F.filter(f=>f.side===i&&f.alive).length);
  let winner = deaths[0]===deaths[1] ? (sur[0]>=sur[1]? (disengaged===0?1:0):1) : (deaths[0]<deaths[1]?0:1);
  if(deaths[0]===deaths[1]&&disengaged<0) winner = pw0[0]>=pw0[1]?0:1;
  st.vision[zone]=clamp((st.vision[zone]||0)+(winner===0?0.3:-0.3),-1,1);
  if(isTeamfight)for(const f of F){f.ps.teamfights++;if(f.side===winner)f.ps.teamfightWins++}
  const res={winner,deaths,sur,init,engOk,disengaged,n:[sideArrs[0].length,sideArrs[1].length]};
  expl(st,`교전 (${ctx.label||zone}) ${sideArrs[0].length}v${sideArrs[1].length}`,[
    ['선공권 Blue',initScore[0]],['선공권 Red',initScore[1]],['진입 성공확률',engP],['교전 전 전력 Blue',pw0[0]/1000],['교전 전 전력 Red',pw0[1]/1000]],
    {prob:engP,result:`${engOk?'진입 성공':'진입 실패'} · ${['Blue','Red'][winner]} 승리 ${deaths[1]}–${deaths[0]}${disengaged>=0?' (후퇴)':''}`});
  if(isTeamfight)
    log(st,`${ctx.label||'한타'}: ${st.sides[winner].team.short} 승리 (${deaths[1-winner]}킬 / ${deaths[winner]}데스)${disengaged>=0?' · 패배 측 후퇴':''}`,{side:winner,major:true,kind:'fight'});
  return res;
}

// ----- 구조물 -----
function laneProgress(s,l){return s.towers[l].filter(x=>!x).length}
function takeStructure(st,side,opt={}){
  const en=st.sides[1-side];
  // 억제기 재생성 처리
  for(const l of LANES) if(!en.towers[l][3]&&en.inhibAt[l]&&st.t>=en.inhibAt[l]){en.towers[l][3]=true;en.inhibAt[l]=0;log(st,`${en.team.short} ${LANE_KO[l]} 억제기 재생성`,{side:1-side})}
  const inhibDown=LANES.some(l=>!en.towers[l][3]);
  if(opt.allowNexus&&inhibDown){
    if(en.nexusT>0){en.nexusT--; st.sides[side].towersTaken++; log(st,`${st.sides[side].team.short} 쌍둥이 포탑 파괴`,{side,major:true,kind:'tower'}); return 'nexusT'}
    en.nexus=false; log(st,`${st.sides[side].team.short} 넥서스 파괴 — 승리`,{side,major:true,kind:'nexus'}); return 'nexus';
  }
  let lanes=opt.lane?[opt.lane]:LANES.slice();
  lanes=lanes.filter(l=>en.towers[l].some(x=>x));
  if(!lanes.length){ if(opt.lane) return takeStructure(st,side,{...opt,lane:null}); return null; }
  lanes.sort((a,b)=>laneProgress(en,b)-laneProgress(en,a)+(st.rng.dec.next()-0.5)*1.5);
  const l=lanes[0], idx=en.towers[l].findIndex(x=>x);
  if(idx===3&&!opt.allowInhib) return null;
  en.towers[l][idx]=false;
  const names=['1차 포탑','2차 포탑','억제기 포탑','억제기'];
  if(idx===3){en.inhibAt[l]=st.t+st.patch.rules.inhibRespawn; log(st,`${st.sides[side].team.short} ${LANE_KO[l]} 억제기 파괴`,{side,major:true,kind:'tower'});}
  else{ st.sides[side].towersTaken++;
    const ft=st.firsts.tower===undefined; if(ft)st.firsts.tower=side;
    const gold=idx===0?250:idx===1?300:350;
    aliveOf(st,side).forEach(p=>addGold(p,Math.round(gold/2)));
    log(st,`${st.sides[side].team.short} ${LANE_KO[l]} ${names[idx]} 파괴${ft?' (첫 포탑)':''}`,{side,major:true,kind:'tower'});
  }
  return l;
}

// ----- 틱: 수입/시야/라인전/정글/오브젝트/운영 -----
function incomeTick(st){
  const R=st.patch.rules, lane=st.t<14;
  for(const s of st.sides) for(const ps of s.ps){
    if(!alive(st,ps)){continue}
    const base=lane?{TOP:8.4,JGL:5.8,MID:8.7,ADC:8.9,SUP:0.9}[ps.role]:{TOP:8.0,JGL:6.6,MID:8.3,ADC:9.4,SUP:1.2}[ps.role];
    let cs=base*(0.72+0.38*at(ps,'csing'));
    if(st.t===1)cs*=ps.role==='JGL'?0.4:0.15;
    const ln=LANES.find(l=>LANE_ROLES[l].includes(ps.role));
    if(lane&&ln){const push=st.lanePush[ln]*(ps.side===0?1:-1); cs*=1+0.12*push}
    if(ps.recall){cs*=0.6;ps.recall=false}
    cs*=(1-ps.penalty)*st.rng.mech.range(0.93,1.07); ps.penalty=0;
    ps.cs+=cs;
    addGold(ps,cs*R.csGold+R.passiveGold+(ps.role==='SUP'?35:0));
    addXp(ps,cs*58+(ps.role==='JGL'?60:0)+(ps.role==='SUP'?(lane?230:320):0)+(!lane&&ps.role!=='SUP'?40:0));
    ps.hp=Math.min(1,ps.hp+0.12);
  }
}
const ZONES=['top','mid','bot','dragon','baron'];
function visionTick(st){
  const inv=[0,1].map(i=>{const s=st.sides[i],a=aliveOf(st,i),tac=.7+.6*s.team.tactics.vision_investment/100;
    for(const p of a)p.vision+=(at(p,'vision_understanding')*(p.role==='SUP'||p.role==='JGL'?1.5:.8))*tac*.65;
    return avg(a.map(p=>at(p,'vision_understanding')*(p.role==='SUP'||p.role==='JGL'?1.5:.8)))*(a.length/5)*tac});
  for(const z of ZONES){const tgt=(inv[0]-inv[1])*1.6;st.vision[z]=clamp(st.vision[z]+(tgt-st.vision[z])*.35+st.rng.info.normal(0,.08),-1,1)}
}
function visFor(st,side,z){return side===0?st.vision[z]:-st.vision[z]}
function pushFor(st,side,l){return side===0?st.lanePush[l]:-st.lanePush[l]}
function lanePS(st,side,l){return st.sides[side].ps.filter(p=>LANE_ROLES[l].includes(p.role))}

function laningTick(st){
  const R=st.rng;
  for(const l of LANES){
    const A=lanePS(st,0,l).filter(p=>alive(st,p)), B=lanePS(st,1,l).filter(p=>alive(st,p));
    if(!A.length||!B.length){ st.lanePush[l]=clamp(st.lanePush[l]+(A.length?0.3:-0.3),-1,1); continue; }
    const wv=a=>avg(a.map(p=>at(p,'wave_control')*0.4+at(p,'pressure')*0.4+p.champ.kit.waveclear/10*0.35+p.champ.kit.early/10*0.25))*Math.sqrt(a.length);
    st.lanePush[l]=clamp(st.lanePush[l]*0.6+(wv(A)-wv(B))*0.9+R.dec.normal(0,0.18),-1,1);
    A.forEach(p=>{p.laneAdv+=st.lanePush[l];p.laneSamples++});B.forEach(p=>{p.laneAdv-=st.lanePush[l];p.laneSamples++});
    const aggr=avg([...A,...B].map(p=>(td(p,'aggression')+td(p,'trading_frequency'))/2));
    if(R.dec.chance(0.25+0.4*aggr)){
      const sc=a=>avg(a.map(p=>(at(p,'trading')*0.4+at(p,'harass')*0.2+at(p,'precision')*0.2+at(p,'skillshot')*0.2)*(0.82+0.26*p.prof.mastery/100)*(0.7+0.06*(p.champ.kit.early+p.champ.kit.poke)/2)))+avg(a.map(p=>p.lvl))*0.03;
      const cons=avg([...A,...B].map(p=>at(p,'consistency')));
      const diff=sc(A)-sc(B)+R.mech.normal(0,0.14*(1.3-cons));
      const W=diff>=0?A:B, L=diff>=0?B:A;
      L.forEach(p=>p.hp=Math.max(0.05,p.hp-Math.min(0.5,0.1+Math.abs(diff)*1.4)));
      W.forEach(p=>p.hp=Math.max(0.1,p.hp-0.07));
      const low=L.reduce((b,p)=>p.hp<b.hp?p:b), win=W.reduce((b,p)=>at(p,'all_in')>at(b,'all_in')?p:b);
      if(low.hp<0.45&&R.dec.chance(td(win,'aggression')*0.45+td(win,'risk_taking')*0.25)){
        let esc=avg([at(low,'dodging'),at(low,'gank_avoidance')]);
        let flash=false;
        if(low.flashAt<=st.t&&R.exec.chance(0.6)){flash=true;low.flashAt=st.t+5;esc+=0.25;log(st,`${pname(st,low)} 점멸 사용`,{side:low.side,kind:'flash'})}
        const p=clamp(0.3+0.55*(1-low.hp)+0.3*(at(win,'all_in')-esc)+(win.lvl-low.lvl)*0.05,0.05,0.9);
        const ok=R.exec.chance(p);
        expl(st,`${LANE_KO[l]} 올인: ${pname(st,win)} → ${low.p.name}`,[['상대 체력',low.hp],['올인 능력',at(win,'all_in')],['회피',esc],['레벨 차',win.lvl-low.lvl],['점멸 사용',flash?1:0]],{prob:p,result:ok?'SUCCESS':'FAIL'});
        if(ok) killPlayer(st,win,low,W,`${LANE_KO[l]} 라인전`);
        else {win.hp=Math.max(0.05,win.hp-0.2); log(st,`${pname(st,win)} 올인 실패`,{side:win.side})}
      }
    }
    for(const p of [...A,...B]) if(alive(st,p)&&p.hp<0.32){
      const good=at(p,'recall_timing'); p.hp=1; p.recall=true; if(good<0.6)p.penalty+=0.1;
      log(st,`${pname(st,p)} 귀환`,{side:p.side,kind:'recall'});
    }
  }
}

function jungleTick(st){
  const R=st.rng;
  for(const side of [0,1]){
    const j=st.sides[side].ps.find(p=>p.role==='JGL'); if(!alive(st,j)||st.t<(st.jgNext[side]))continue;
    const ej=st.sides[1-side].ps.find(p=>p.role==='JGL'), t=st.sides[side].team.tactics;
    const noiseSd=0.3*(1.15-0.5*at(j,'map_awareness')-0.5*at(j,'decision_making'));
    const opts=[{kind:'farm',u:0.45+0.25*(1-td(j,'aggression'))+Math.max(0,ej.lvl-j.lvl)*0.12,f:[]}];
    for(const l of LANES){
      const en=lanePS(st,1-side,l).filter(p=>alive(st,p)); if(!en.length)continue;
      const al=lanePS(st,side,l).filter(p=>alive(st,p));
      const tgt=en.reduce((b,p)=>p.hp<b.hp?p:b);
      const pr=-pushFor(st,side,l), hpF=1-tgt.hp, fl=tgt.flashAt>st.t?1:0, vis=visFor(st,side,l);
      const allyCC=al.reduce((s,p)=>s+p.champ.kit.cc,0)/20;
      const f=[['상대 라인 푸시',0.4*pr],['상대 체력',0.5*hpF],['상대 점멸 없음',0.35*fl],['시야',0.3*vis],['아군 CC',allyCC],['공격성',0.2*td(j,'aggression')]];
      const trueU=0.2+f.reduce((s,x)=>s+x[1],0);
      opts.push({kind:'gank',lane:l,tgt,al,en,u:trueU+R.info.normal(0,noiseSd),trueU,f,pr,hpF,fl,vis});
    }
    const ch=opts.reduce((b,o)=>o.u>b.u?o:b);
    if(ch.kind==='farm'){st.jgNext[side]=st.t+R.dec.range(1.5,2.5);continue}
    st.jgNext[side]=st.t+R.dec.range(2,3.2);
    const avoid=avg(ch.en.map(p=>at(p,'gank_avoidance')));
    const eVis=Math.max(0,-ch.vis);
    let p=clamp(0.42+0.22*ch.pr+0.3*ch.hpF+0.15*ch.fl+0.15*ch.vis-0.45*(avoid-0.65)-0.2*eVis+0.15*(at(j,'pressure')-0.6),0.08,0.9);
    let cg=0; if(alive(st,ej)) cg=clamp(0.02+0.16*at(ej,'anticipation')*(1-Math.max(0,ch.vis))+0.06*td(ej,'aggression'),0.02,0.3);
    const roll=R.exec.next();
    let result;
    if(R.info.chance(cg)){
      result='COUNTERGANK';
      log(st,`${pname(st,j)} ${LANE_KO[ch.lane]} 갱킹 → ${ej.p.name} 카운터 정글`,{side,major:true,kind:'gank'});
      const sides=side===0?[[j,...ch.al],[...ch.en,ej]]:[[...ch.en,ej],[j,...ch.al]];
      fight(st,ch.lane,sides,{label:`${LANE_KO[ch.lane]} 카운터 정글`});
    } else if(roll<p){
      result='SUCCESS';
      log(st,`${pname(st,j)} ${LANE_KO[ch.lane]} 갱킹`,{side,kind:'gank'});
      killPlayer(st,j,ch.tgt,[j,...ch.al],`${LANE_KO[ch.lane]} 갱킹`);
      const other=ch.en.find(x=>x!==ch.tgt&&alive(st,x));
      if(other&&R.exec.chance(0.3)) killPlayer(st,R.exec.pick(ch.al.length?ch.al:[j]),other,[j,...ch.al],'더블 킬 갱킹');
    } else {
      result='FAIL';
      if(ch.tgt.flashAt<=st.t){ch.tgt.flashAt=st.t+5; log(st,`${pname(st,j)} ${LANE_KO[ch.lane]} 갱킹 — ${ch.tgt.p.name} 점멸로 생존`,{side,kind:'gank'});}
      else log(st,`${pname(st,j)} ${LANE_KO[ch.lane]} 갱킹 실패`,{side,kind:'gank'});
    }
    expl(st,`${st.sides[side].team.short} 정글 → ${LANE_KO[ch.lane]} 갱킹`,ch.f,{utility:ch.trueU,perceived:ch.u,prob:p,counter:cg,result});
  }
}

function teamCall(st,side,obj,stakeBonus){
  const s=st.sides[side], a=aliveOf(st,side); if(!a.length) return {go:false,part:[],votes:[]};
  const pr=teamPower(st,side)/(teamPower(st,1-side)||1);
  const z=obj==='baron'?'baron':obj==='herald'?'top':'dragon';
  const lanes=obj==='dragon'||obj==='elder'?['bot','mid']:['top','mid'];
  const prio=avg(lanes.map(l=>pushFor(st,side,l)));
  const base=(s.team.tactics.objective_priority/100-0.5)*0.6+(pr-1)*1.6+visFor(st,side,z)*0.4+prio*0.25+(a.length-aliveOf(st,1-side).length)*0.35+stakeBonus;
  let W=0,U=0; const votes=[];
  for(const p of a){
    const u=base+(td(p,'objective_preference')-0.5)*0.4+st.rng.info.normal(0,0.35*(1.15-at(p,'decision_making')));
    const w=(at(p,'shotcalling')*0.6+at(p,'communication')*0.4)*(p.role==='JGL'||p.role==='SUP'?1.2:1);
    votes.push([p,u]); W+=w; U+=u*w;
  }
  const go=U/W>0.05;
  const part=votes.filter(([p,u])=>(u>0.05)===go||st.rng.dec.chance(0.55+0.4*avg([at(p,'communication'),td(p,'teamplay')]))).map(v=>v[0]);
  return {go,part:go?part:[],votes,base,pr};
}

function objectiveTick(st){
  const o=st.obj, R=st.rng, rules=st.patch.rules;
  const run=(key,label,z,stake,reward)=>{
    o.wait[key]=(o.wait[key]||0)+1;
    const c=[0,1].map(i=>teamCall(st,i,key,stake(i)+(o.wait[key]-1)*0.25));
    expl(st,`${label} 콜`,c.flatMap((x,i)=>x.votes.map(([p,u])=>[`${['Blue','Red'][i]} ${ROLE_KO[p.role]}`,u])),{result:`Blue ${c[0].go?'싸움':'포기'} / Red ${c[1].go?'싸움':'포기'}`});
    let taker=-1;
    if(c[0].go&&c[1].go&&c[0].part.length&&c[1].part.length){
      for(const i of [0,1]){const n=aliveOf(st,i).length-c[i].part.length; if(n>0&&c[i].part.length<aliveOf(st,i).length) log(st,`${st.sides[i].team.short} 콜 불일치 — ${n}명 합류 실패`,{side:i})}
      const r=fight(st,z,[c[0].part,c[1].part],{label:`${label} 한타`});
      const w=r.winner, wa=c[w].part.filter(p=>alive(st,p));
      if(wa.length){
        taker=w;
        const lj=st.sides[1-w].ps.find(p=>p.role==='JGL');
        if(alive(st,lj)&&R.exec.chance(0.04+0.12*at(lj,'smite_execution')*(r.deaths[1-w]<=1?1:0.3))){taker=1-w;log(st,`${pname(st,lj)} ${label} 스틸!`,{side:1-w,major:true,kind:'obj'})}
      }
    } else if(c[0].go!==c[1].go){
      taker=c[0].go?0:1;
      const giver=1-taker;
      if(st.t>=10&&R.dec.chance(0.45+0.3*avg(aliveOf(st,giver).map(p=>at(p,'crossmap_decision'))))){
        log(st,`${st.sides[giver].team.short} ${label} 포기 → 반대편 교환`,{side:giver});
        takeStructure(st,giver,{lane:key==='baron'||key==='herald'?'bot':'top'});
      }
    }
    if(taker>=0){o.wait[key]=0;const involved=c[taker]&&c[taker].part&&c[taker].part.length?c[taker].part:aliveOf(st,taker);involved.forEach(p=>p.objectives++);reward(taker);}
  };
  if(!o.soul&&o.dragonAt&&st.t>=o.dragonAt){
    const type=o.dragonTypes[o.dragonIdx%o.dragonTypes.length];
    run('dragon',`${type} 드래곤`,'dragon',i=>{const m=st.sides[i].dragons.length,e=st.sides[1-i].dragons.length;return (m===3?0.4:0)+(e===3?0.6:0)},w=>{
      st.sides[w].dragons.push(type); o.dragonIdx++; if(st.firsts.dragon===undefined)st.firsts.dragon=w;
      aliveOf(st,w).forEach(p=>addGold(p,40));
      log(st,`${st.sides[w].team.short} ${type} 드래곤 처치 (${st.sides[w].dragons.length}스택)`,{side:w,major:true,kind:'obj'});
      if(st.sides[w].dragons.length>=4){st.sides[w].soul=true;o.soul=true;o.elderAt=st.t+6;log(st,`${st.sides[w].team.short} 드래곤 영혼 획득`,{side:w,major:true,kind:'obj'})}
      else o.dragonAt=st.t+rules.dragonRespawn;
    });
  }
  if(o.soul&&o.elderAt&&st.t>=o.elderAt){
    run('elder','장로 드래곤','dragon',()=>0.8,w=>{st.sides[w].elderUntil=st.t+rules.elderBuff;o.elderAt=st.t+6;log(st,`${st.sides[w].team.short} 장로 드래곤 처치`,{side:w,major:true,kind:'obj'})});
  }
  if(!o.heraldDone&&st.t>=rules.heraldSpawn&&st.t<20){
    run('herald','협곡의 전령','top',()=>-0.1,w=>{o.heraldDone=true;st.sides[w].herald++;st.sides[w].heraldCharge=true;log(st,`${st.sides[w].team.short} 협곡의 전령 획득`,{side:w,major:true,kind:'obj'})});
  }
  if(st.t>=o.baronAt){
    run('baron','바론','baron',()=>0.1,w=>{st.sides[w].baronUntil=st.t+rules.baronBuff;st.sides[w].barons++;o.baronAt=st.t+rules.baronRespawn;
      if(st.firsts.baron===undefined)st.firsts.baron=w;
      aliveOf(st,w).forEach(p=>addGold(p,300));
      log(st,`${st.sides[w].team.short} 바론 처치`,{side:w,major:true,kind:'obj'})});

function convert(st,w,r){
  const diff=aliveOf(st,w).length-aliveOf(st,1-w).length;
  if(aliveOf(st,w).length<2||diff<1)return;
  let n=Math.max(1,diff-1);
  if(st.t>=st.obj.baronAt&&diff>=2&&st.rng.dec.chance(0.6)){
    st.sides[w].baronUntil=st.t+st.patch.rules.baronBuff; st.sides[w].barons++; st.obj.baronAt=st.t+st.patch.rules.baronRespawn;
    if(st.firsts.baron===undefined)st.firsts.baron=w;
    aliveOf(st,w).forEach(p=>addGold(p,300));
    log(st,`${st.sides[w].team.short} 한타 승리 후 바론 처치`,{side:w,major:true,kind:'obj'}); n--;
  }
  const buffed=st.sides[w].baronUntil>st.t||st.sides[w].elderUntil>st.t;
  const allowNexus=diff>=3||aliveOf(st,1-w).length<=1||(diff>=2&&(buffed||st.t>=30))||(buffed&&st.t>=30);
  for(let i=0;i<n;i++){const res=takeStructure(st,w,{allowInhib:diff>=2,allowNexus:allowNexus&&i>0});if(res==='nexus')return}
  if(allowNexus) takeStructure(st,w,{allowInhib:true,allowNexus:true});
}

function macroTick(st){
  const R=st.rng;
  const gold=[0,1].map(i=>st.sides[i].ps.reduce((s,p)=>s+p.goldEarned,0));
  const force=[0,1].map(i=>{const s=st.sides[i], t=s.team.tactics;
    const pr=teamPower(st,i)/(teamPower(st,1-i)||1);
    const u=(pr-1)*2+(aliveOf(st,i).length-aliveOf(st,1-i).length)*0.4+(s.baronUntil>st.t?0.6:0)+(s.elderUntil>st.t?0.8:0)+(t.aggression/100-0.5)*0.6+(gold[i]-gold[1-i])/12000+(st.t>38?0.3:0)+R.info.normal(0,0.2);
    return {u,pr}});
  const att=force[0].u>=force[1].u?0:1, def=1-att;
  if(force[att].u>0.25&&R.dec.chance(0.3+(st.t>35?0.3:0))){
    const dSide=st.sides[def];
    const later=avg(dSide.ps.map(p=>p.champ.kit.late-p.champ.kit.mid))/10;
    const avoid=clamp(0.2+0.3*avg(aliveOf(st,def).map(p=>p.champ.kit.disengage/10))+0.2*visFor(st,def,'mid')+(st.t<30?later*0.5:0)-(force[att].u-0.15)*0.3,0.05,0.7);
    expl(st,`${st.sides[att].team.short} 교전 강제 시도`,[['전력비',force[att].pr],['강제 효용',force[att].u],['상대 회피 확률',avoid]],{result:''});
    if(R.dec.chance(avoid)){
      log(st,`${dSide.team.short} 교전 회피 — ${st.sides[att].team.short} 압박`,{side:att});
      takeStructure(st,att,{allowInhib:force[att].u>0.8});
    } else {
      const deep=LANES.some(l=>laneProgress(dSide,l)>=2);
      const r=fight(st,'mid',att===0?[aliveOf(st,0),aliveOf(st,1)]:[aliveOf(st,0),aliveOf(st,1)],{label:deep?'수성 한타':'중앙 한타',defender:deep?def:undefined});
      if(r) convert(st,r.winner,r);
    }
    return;
  }
  // 픽 시도
  for(const side of [0,1]){
    const s=st.sides[side]; if(!R.dec.chance(0.12+0.18*s.team.tactics.aggression/100))continue;
    const en=aliveOf(st,1-side), al=aliveOf(st,side); if(!en.length||al.length<2)continue;
    const tgt=en.reduce((b,p)=>{const v=(1-at(p,'map_awareness'))+td(p,'split_preference')*0.5;return !b||v>b.v?{p,v}:b},null).p;
    const lane=LANES.find(l=>LANE_ROLES[l].includes(tgt.role))||'mid';
    const p=clamp(0.25+0.4*visFor(st,side,lane)+0.4*(0.7-at(tgt,'map_awareness'))+0.2*td(tgt,'split_preference'),0.05,0.75);
    const ok=R.exec.chance(p);
    expl(st,`${s.team.short} 끊기 시도 → ${tgt.p.name}`,[['시야',visFor(st,side,lane)],['대상 맵 인지',at(tgt,'map_awareness')],['대상 스플릿 성향',td(tgt,'split_preference')]],{prob:p,result:ok?'SUCCESS':'FAIL'});
    if(ok){
      const hunters=al.slice().sort(()=>R.dec.next()-0.5).slice(0,Math.min(3,al.length));
      const help=en.filter(x=>x!==tgt&&R.dec.chance(0.3*at(x,'rotation')));
      const sides=side===0?[hunters,[tgt,...help]]:[[tgt,...help],hunters];
      const r=fight(st,lane,sides,{label:`${LANE_KO[lane]} 끊기`});
      if(r&&r.winner===side) convert(st,side,r);
      break;
    }
  }
}

function towerTick(st){
  const R=st.rng;
  if(st.t<8)return;
  for(const side of [0,1]){
    const s=st.sides[side], en=st.sides[1-side];
    for(const l of LANES){
      const idx=en.towers[l].findIndex(x=>x); if(idx<0||idx>=3)continue;
      let p;
      if(st.t<14){
        const push=pushFor(st,side,l); if(push<0.25)continue;
        const enAlive=lanePS(st,1-side,l).filter(x=>alive(st,x)).length;
        p=(0.05+0.18*push)*(enAlive?0.6:1.8);
      } else {
        const pr=teamPower(st,side)/(teamPower(st,1-side)||1);
        const split=s.ps.some(x=>alive(st,x)&&td(x,'split_preference')>0.65&&LANE_ROLES[l].includes(x.role))?0.06*at(s.ps.find(x=>td(x,'split_preference')>0.65),'sidelane'):0;
        p=0.03+0.12*(pr-1)+0.05*(5-aliveOf(st,1-side).length)+split+(s.baronUntil>st.t?0.3:0);
      }
      if(s.heraldCharge){p+=0.35;}
      p*=[1,0.65,0.4][idx];
      if(R.exec.chance(clamp(p,0,0.8))){ if(s.heraldCharge){s.heraldCharge=false;log(st,`${s.team.short} 전령 사용 (${LANE_KO[l]})`,{side})} takeStructure(st,side,{lane:l}); }
    }
    // 억제기가 밀린 팀은 슈퍼 미니언 압박을 받는다
    const inhibDown=LANES.filter(l=>!en.towers[l][3]).length;
    if(inhibDown&&st.t>=20&&R.exec.chance(0.08*inhibDown+(aliveOf(st,1-side).length<=2?0.35:0))) takeStructure(st,side,{allowInhib:true,allowNexus:aliveOf(st,1-side).length<=3});
    if(st.t>=22&&s.baronUntil>st.t&&R.exec.chance(0.3)) takeStructure(st,side,{allowInhib:true});
  }
}

function simulateMatch(db,blueId,redId,seed,ctx,quiet){
  const rng=makeStreams(seed);
  const patch=db.patch;
  const d=runDraft(db,[blueId,redId],rng.draft,ctx);
  const mkSide=(tid,i)=>{const team=db.teams[tid];const ps=ROLES.map(r=>{const p=starterFor(db,team,r);return newPS(p,i,r,d.picks[i][r],patch)});
    return {team,ps,towers:{top:[1,1,1,1],mid:[1,1,1,1],bot:[1,1,1,1]},inhibAt:{top:0,mid:0,bot:0},nexusT:2,nexus:true,dragons:[],soul:false,baronUntil:0,elderUntil:0,herald:0,heraldCharge:false,barons:0,kills:0,towersTaken:0}};
  const st={t:0,cur:0,quiet:!!quiet,seed,rng,patch,sides:[mkSide(blueId,0),mkSide(redId,1)],lanePush:{top:0,mid:0,bot:0},vision:{top:0,mid:0,bot:0,dragon:0,baron:0},
    obj:{dragonAt:patch.rules.dragonSpawn,dragonIdx:0,dragonTypes:rng.dec.chance(0.5)?['화염','대지','바다','바람']:['바다','바람','화염','대지'],soul:false,elderAt:0,heraldDone:false,baronAt:patch.rules.baronSpawn,wait:{}},
    jgNext:[2.6+rng.dec.range(0,1),2.6+rng.dec.range(0,1)],mods:[(ctx&&ctx.mods&&ctx.mods[blueId])||0,(ctx&&ctx.mods&&ctx.mods[redId])||0],log:[],expl:[...d.expl],firsts:{},goldHist:[],winner:-1};
  for(const s of st.sides){s.ps.forEach(p=>{p.items=[]})}
  // 경기 당일 컨디션: 기복(consistency)이 낮은 팀일수록 편차가 크다
  st.mods=st.mods.map((m,i)=>m+(i===((ctx&&ctx.firstPick)||0)?BAL.first:0)+(teamSynergy(st.sides[i].team)-50)/1000+rng.mech.normal(0,0.07*(1.25-avg(st.sides[i].ps.map(p=>at(p,'consistency'))))));
  let t;
  for(t=1;t<=70;t++){
    st.t=t; st.cur=rng.log.int(0,12);
    incomeTick(st); visionTick(st);
    if(t>=2&&t<14) laningTick(st);
    if(t>=2&&t<16) jungleTick(st);
    objectiveTick(st);
    if(t>=14) macroTick(st);
    towerTick(st);
    // 억제기 재생성
    for(const s of st.sides) for(const l of LANES) if(!s.towers[l][3]&&s.inhibAt[l]&&t>=s.inhibAt[l]){s.towers[l][3]=true;s.inhibAt[l]=0}
    const g=st.sides.map(s=>s.ps.reduce((a,p)=>a+p.goldEarned,0)); st.goldHist.push(g[0]-g[1]);
    const dead=st.sides.findIndex(s=>!s.nexus); if(dead>=0){st.winner=1-dead;break}
    if(t===70){st.winner=g[0]>=g[1]?0:1; log(st,'시간 제한 — 골드 우위 팀 승리 처리',{major:true})}
  }
  const endSec=Math.min(59,(st.cur||0)+1);
  st.log.sort((a,b)=>a.t-b.t||a.sec-b.sec);
  const last=st.log[st.log.length-1]; if(last&&last.kind==='nexus')last.sec=endSec;
  return {seed,winner:st.winner,duration:t+endSec/60,durationStr:fmtTime(t,endSec),draft:d,sides:st.sides,log:st.log,expl:st.expl,goldHist:st.goldHist,firsts:st.firsts};
}

function monteCarlo(db,blueId,redId,n,baseSeed){
  const acc={wins:0,time:0,gd15:0,fd:0,ft:0,fb:0,baron:[0,0],kills:[0,0],towers:[0,0],dragons:[0,0],fights:[0,0],n:0,times:[]};
  for(let i=0;i<n;i++){
    const r=simulateMatch(db,blueId,redId,baseSeed+'#'+i);
    acc.n++; if(r.winner===0)acc.wins++; acc.time+=r.duration; acc.times.push(r.duration);
    acc.gd15+=r.goldHist[14]??r.goldHist[r.goldHist.length-1];
    if(r.firsts.dragon===0)acc.fd++; if(r.firsts.tower===0)acc.ft++; if(r.firsts.blood===0)acc.fb++;
    for(const i2 of [0,1]){acc.baron[i2]+=r.sides[i2].barons>0?1:0;acc.kills[i2]+=r.sides[i2].kills;acc.towers[i2]+=r.sides[i2].towersTaken;acc.dragons[i2]+=r.sides[i2].dragons.length}
    for(const l of r.log) if(l.kind==='fight') acc.fights[l.side]++;
  }
  return acc;
}

function nextMid(s){return `${s.id}_match_${s.days.reduce((n,d)=>n+d.matches.length,0)}`}

function seedSort(sd,arr){return arr.slice().sort((a,b)=>sd.seeds.indexOf(a)-sd.seeds.indexOf(b))}

// 더블 엘리미네이션: 승자조 → (패자조 교차) → 패자조 → … → 최종 결승

function standings(db,s,stageId){

function managedTeamId(db){return db.manager&&db.manager.teamId||null}
function managedTeam(db){const id=managedTeamId(db);return id&&db.teams[id]?db.teams[id]:null}
function setManagedTeam(db,teamId){
  if(teamId!==null&&(!db.teams[teamId]||db.teams[teamId].active===false))throw new Error('관리할 수 없는 팀입니다');
  db.manager.teamId=teamId;return teamId;
}
function startCareer(db,teamId,seed){
  if(!db.firstSeasonSetup||!db.firstSeasonSetup.blankRosters)throw new Error('첫 시즌 백지 로스터 세계가 준비되지 않았습니다');
  return beginInitialRosterPhase(db,teamId,seed);

function validateConfig(cfg){
  const errs=[], shorts=new Set();
  if(!cfg.regions.length)errs.push('리그가 하나 이상 있어야 합니다');
  for(const r of cfg.regions){
    if(!r.short||shorts.has(r.short))errs.push(`리그 약칭 "${r.short}"이 비었거나 겹칩니다`);shorts.add(r.short);shorts.add(r.short+'2');
    if(r.teams<10||r.teams%2)errs.push(`${r.leagueName}: 1부 팀 수는 최소 10팀이며 짝수여야 합니다`);
    if(r.playoffTake>r.teams)errs.push(`${r.leagueName}: 플레이오프 진출 팀이 전체 팀보다 많습니다`);
    if(r.format==='groups_po'&&r.teams<10)errs.push(`${r.leagueName}: 그룹 스테이지 방식은 10팀 이상에서 쓸 수 있습니다`);
    if(r.div2&&r.system!=='franchise'&&(r.div2Teams||6)%2)errs.push(`${r.leagueName}: 하부 리그 팀 수는 짝수여야 합니다`);
  }
  for(const it of cfg.internationals) if(shorts.has(it.id)||shorts.has(it.short))errs.push(`${it.name}: 리그 약칭과 겹칩니다`);
  return errs;
}

// ---------- 리그/시즌 구성 ----------
function divName(R){return R.system==='franchise'?`${R.leagueName} 챌린저스`:`${R.leagueName} 2부`}
function leagueComp(db,rid,div=1){
  const R=db.regions[rid], teams=activeTeams(db,rid,div).filter(t=>div===1||true).map(t=>t.id);
  return {id:div===2?R.short+'2':R.short,name:div===2?divName(R):R.leagueName,short:div===2?R.short+'2':R.short,region:rid,div,teams,rules:{fearless:true},stages:leagueStages(R,teams.length,div)};
}
function startWorldSeason(db,myTeam,seed){
  setManagedTeam(db,myTeam);
  const regs=Object.values(db.regions), I=db.worldConfig.internationals, maxK=Math.max(...regs.map(r=>r.splits||1));
  const steps=[];
  const intlSteps=tm=>{const tops=I.filter(i=>i.timing===tm&&i.tier!=='low').sort((a,b)=>(a.prestige||1)-(b.prestige||1)),lows=I.filter(i=>i.timing===tm&&i.tier==='low');
    const out=tops.map(i=>({kind:'intl',ids:[i.id],label:i.name}));
    if(lows.length){if(out.length){const L=out[out.length-1];L.ids.push(...lows.map(i=>i.id));L.label+=` · ${lows.map(i=>i.name).join(' · ')}`}else out.push({kind:'intl',ids:lows.map(i=>i.id),label:lows.map(i=>i.name).join(' · ')})}
    return out};
  // 3스플릿제: 스플릿1(윈터) → 퍼스트 스탠드 → 스플릿2(스프링) → MSI → 스플릿3(서머) → 월즈. 스플릿이 적은 리그는 뒤쪽 스플릿만 치른다
  const tim={1:'early',2:'mid',3:'end'};
  for(let sp=1;sp<=3;sp++){
    if(regs.some(r=>(r.splits||1)>=4-sp))steps.push({kind:'league',split:sp,label:maxK===1?'정규 시즌':SPLIT_NAME[sp]});
    steps.push(...intlSteps(tim[sp]));
  }
  const manage=db.world?db.world.manage:(db.worldConfig.manage||'manual');
  db.world={year:db.year,seed,manage,phase:'season',seasons:{},steps,step:-1,report:null,lastDate:`${db.year}-01-07`,offers:[],marketLog:[]};
  seasonPatch(db,`${db.year}-01-02`,new RNG(seed+db.year,'patch'));
  setGoals(db);
  advanceStep(db);
}
function seasonLastDate(s){return s.days[s.days.length-1].date}
// 저장 공간 절약: 내 지역이 아닌 리그 경기는 세트 요약만 남긴다
function compactSeason(db,s){
  if(s.compact)return; const my=db.teams[managedTeamId(db)].region; if(s.region===my||db.competitions[s.comp].international)return;
  for(const d of s.days)for(const m of d.matches)if(m.res){const r=m.res;r.games=r.games.map(g=>({n:g.n,blue:g.blue,red:g.red,winner:g.winner,kills:g.kills,dur:g.dur,mvp:g.mvp}));delete r.tac;r.lite=true}
  s.compact=true;
}
function compactFinishedSeasonForSave(db,s){
  if(!s||!s.done)return;
  compactSeason(db,s);
  for(const d of s.days)for(const m of d.matches)if(m.res){delete m.res.seed;delete m.res.firstChoice}
}
function advanceStep(db){
  const w=db.world;
  for(const s of Object.values(w.seasons))if(s.done)compactSeason(db,s);
  for(const s of Object.values(w.seasons)){const d=seasonLastDate(s);if(d>w.lastDate)w.lastDate=d}
  while(true){
    w.step++;
    if(w.step>=w.steps.length){w.phase='offseason';news(db,`${w.year} 시즌 일정이 모두 끝났습니다`);return}
    const st=w.steps[w.step], start=addDays(w.lastDate,st.kind==='intl'?18:(w.step===0?7:14));
    if(st.kind==='league'){
      if(st.split>1&&w.step>0){ // 스플릿 개막: 대형 패치 + 사무국 중간 점검
        const rng=new RNG(w.seed+w.year,'mid');
        const p=newPatch(db,start,true,rng);db.patches.nextDate=addDays(start,db.patches.cadence||14);
        const nc=p.notes.find(n=>n.type==='new');news(db,`${SPLIT_NAME[st.split]} 개막 패치 ${p.id}${nc?` — 신규 챔피언 ${nc.def.name} 출시`:''}`);
        officeMidSeason(db,rng,CHANGE_F[db.worldConfig.changes]??1);
      }
      let any=false;
      for(const R of Object.values(db.regions)){
        if((R.splits||1)<4-st.split)continue;
        for(const div of R.div2?[1,2]:[1]){
          if(activeTeams(db,R.id,div).length<2)continue;
          const comp=leagueComp(db,R.id,div); db.competitions[comp.id]=comp;
          const key=comp.id+'-'+st.split, s=newSeason(db,comp.id,w.year,`${w.seed}/${w.year}/${key}`,start,key);
          s.key=key;s.split=st.split;s.region=R.id;s.div=div;s.step=w.step;s.label=(R.splits||1)>1?SPLIT_NAME[st.split]:'';
          w.seasons[key]=s;any=true;
        }
      }
      if(any)return;
    } else {let any=false;const taken=new Set();for(const id of (st.ids||[st.id]))if(startInternational(db,id,start,taken))any=true;if(any)return}
  }
}
function placements(db,s){
  const comp=db.competitions[s.comp];const reg=standings(db,s,comp.stages[0].id).map(x=>x.tid);
  const out=[s.champion,s.runnerUp].filter(Boolean);for(const t of reg)if(!out.includes(t))out.push(t);return out;
}
function regionPlacements(db,R){
  const w=db.world, act=activeTeams(db,R.id,1).map(t=>t.id);
  const done=[3,2,1].map(sp=>w.seasons[R.short+'-'+sp]).find(s=>s&&s.done);
  let base=done?placements(db,done):(R.lastPlacement||[]);
  base=base.filter(t=>act.includes(t));
  const rest=act.filter(t=>!base.includes(t)).sort((a,b)=>teamStrength(db,b)-teamStrength(db,a));
  return [...base,...rest];
}
function regionPower(db,R){const h=(db.global&&db.global.power||{})[R.id];return h!==undefined?h:R.strength}
function teamStrength(db,tid){const t=db.teams[tid];return avg(ROLES.map(r=>{const p=starterFor(db,t,r);return p?playerOvr(p):40}))}
function startInternational(db,id,start,taken=new Set()){
  const w=db.world, it=db.worldConfig.internationals.find(x=>x.id===id); if(!it)return false;
  const regs=Object.values(db.regions).filter(R=>!it.zone||(INTL_ZONES[it.zone]||[]).includes(R.id)).sort((a,b)=>regionPower(db,b)-regionPower(db,a));
  const topSlots=R=>{const top=db.worldConfig.internationals.find(x=>x.tier!=='low'&&x.timing===it.timing&&x.entry==='slots');return top?Math.max(1,Math.ceil(R.slots*(top.ratio||1))):R.slots};
  const lists=regs.map(R=>{
    if(it.entry==='champions')return regionPlacements(db,R).slice(0,1);
    if(it.entry==='slots')return regionPlacements(db,R).slice(0,Math.max(1,Math.ceil(R.slots*(it.ratio||1))));
    const per=(it.per||2)*(regs.length<=2?2:1);
    if(it.entry==='div2'&&R.div2){const s=[3,2,1].map(sp=>w.seasons[R.short+'2-'+sp]).find(s=>s&&s.done);if(s)return placements(db,s).filter(t=>!taken.has(t)).slice(0,per)}
    // 'next' (또는 하부 리그 없는 지역): 상위 대회 진출권 바로 다음 순위부터, 같은 기간 다른 대회에 이미 나간 팀은 건너뜀
    return regionPlacements(db,R).slice(topSlots(R)).filter(t=>!taken.has(t)).slice(0,per);
  }).map(l=>l.filter(t=>!taken.has(t)));
  const teams=[];for(let k=0;k<6;k++)for(const l of lists)if(l[k])teams.push(l[k]);
  if(teams.length<4)return false;
  teams.forEach(t=>taken.add(t));
  db.competitions[id]={id,name:it.name,short:it.short||id,teams,rules:{fearless:true},international:true,tier:it.tier||'top',stages:intlStages(it.format,teams,it.bo)};
  const s=newSeason(db,id,w.year,`${w.seed}/${w.year}/${id}`,start,id);
  s.key=id;s.label='';s.step=w.step;w.seasons[id]=s;
  s.stagesInfo=db.competitions[id].stages.map(x=>x.name).join(' → ');
  news(db,`${it.name} 개막 — ${teams.length}팀 참가 (${INTL_FORMATS[it.format]||it.format})`);
  return true;
}
function activeSeasons(db){return Object.values(db.world.seasons).filter(s=>!s.done)}
function nextDate(db){let next=null;for(const s of Object.values(db.world.seasons)){if(s.done)continue;const d=s.days[s.cur].date;if(next===null||d<next)next=d}return next}
function nextTeamMatch(db,tid){
  let best=null;for(const s of Object.values(db.world?.seasons||{})){if(s.done)continue;for(let i=s.cur;i<s.days.length;i++){const d=s.days[i],m=d.matches.find(x=>!x.res&&(x.a===tid||x.b===tid));if(m&&(!best||d.date<best.date)){best={date:d.date,opponent:m.a===tid?m.b:m.a,comp:s.comp};break}}}return best;
}
function daysUntil(db,date){return date?Math.max(0,Math.ceil((new Date(date)-new Date(db.worldDate))/86400000)):99}
function trainingRecommendation(db,t){
  const next=nextTeamMatch(db,t.id),days=daysUntil(db,next?.date),roster=t.roster.map(id=>db.players[id]).filter(Boolean),fat=avg(roster.map(p=>p.fatigue||0)),cond=avg(roster.map(p=>p.condition??96));

function playWorldDay(db){
  const w=db.world; if(w.phase!=='season')return null;
  const d=nextDate(db); if(!d){advanceStep(db);return {date:null,played:[]}}
  db.worldDate=d;
  patchTick(db,d,new RNG(w.seed+d,'patch'));
  dailyRecovery(db);
  for(const t of activeTeams(db))aiManageTraining(db,t);
  if(typeof aiRunScrims==='function')aiRunScrims(db,new RNG(w.seed+d,'scrim'));
  // 시즌 중에는 경기일마다 AI 산하 2군의 승격/육성 필요를 재평가하되, 모든 이동은 플레이어와 같은 rosterMoveCheck를 통과한다.
  for(const t of activeTeams(db,null,1))aiManageOwnedReserve(db,t);

  for(const s of activeSeasons(db)) if(s.days[s.cur].date===d){const day=playDay(db,s);played.push({s,day});scoutFromDay(db,s,day)}

function news(db,text){db.news.unshift({year:db.world?db.world.year:db.year,text});if(db.news.length>250)db.news.length=250}

  rep.growth.sort((a,b)=>b.d-a.d);
  for(const p of Object.values(db.players)){ if(p.retired)continue;

    let pr=declineYears<=0?0:declineYears*.06*dev.declineRate+(p.age>=31?.18:0)+(R&&o<R.strength-8?.12:0);
