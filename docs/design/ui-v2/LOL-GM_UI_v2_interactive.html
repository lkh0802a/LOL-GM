<style>

.header{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:11px}.logo{display:grid;place-items:center;width:41px;height:41px;border-radius:12px;background:var(--primary);color:white}.brand-name{font-size:18px;letter-spacing:.3px;font-weight:800}.brand-caption,.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--muted);font-weight:700}.actions,.season-row,.row{display:flex;align-items:center;gap:10px}.actions{flex-shrink:0}.season-row{justify-content:space-between;margin-top:17px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;background:var(--good);border-radius:100%;display:inline-block}.status-dot{display:flex;align-items:center;gap:7px}.icon-button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:11px;padding:10px;display:grid;place-items:center}.icon-button svg{width:18px;height:18px}.btn{border:1px solid transparent;border-radius:10px;padding:11px 15px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;transition:filter .12s}.btn:hover:not(:disabled){filter:brightness(1.08)}.btn-primary{background:var(--primary);color:#fff}.btn-outline{background:transparent;border-color:var(--line);color:var(--fg)}.btn-soft{background:var(--active);color:var(--accent)}.btn-small{font-size:12px;min-height:32px;padding:7px 11px}.btn-full{width:100%}
.nav-wrap{border-top:1px solid var(--line);margin-top:17px;padding-top:12px}.primary-nav,.sub-nav,.filter-row{display:flex;align-items:stretch;gap:5px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior-x:contain;touch-action:pan-x;padding-bottom:8px}.primary-nav{scroll-snap-type:x proximity}.nav-item{position:relative;border:0;border-radius:11px;background:transparent;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;min-width:80px;min-height:72px;padding:12px 11px 10px;flex:0 0 auto;scroll-snap-align:start}.nav-item.selected{background:var(--active);color:var(--accent)}.nav-item:hover{background:var(--card)}.nav-item.selected:hover{background:var(--active)}.nav-item span{font-size:11px;white-space:nowrap;font-weight:600}.nav-item .tiny-count{position:absolute;top:5px;right:7px;background:var(--primary);color:white;font-size:9px;border-radius:100px;min-width:16px;padding:2px 3px}.sub-nav{gap:25px;border-bottom:1px solid var(--line);margin-top:9px;padding-bottom:0}.sub-item{background:transparent;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:13px 0 12px;font-weight:600;font-size:13px;white-space:nowrap;flex:0 0 auto}.sub-item.selected{color:var(--fg);border-bottom-color:var(--accent)}.sub-item:hover{color:var(--fg)}
.content-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px;margin-bottom:20px}.content-head h1{font-size:22px;letter-spacing:-.5px;margin:5px 0 0}.budget-pill{background:var(--panel);border:1px solid var(--line);padding:11px 15px;border-radius:11px;min-width:132px;text-align:right}.budget-pill small{font-size:10px;color:var(--muted);display:block;margin-bottom:4px}.budget-pill b{font-size:14px}.content{display:grid;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panel-heading strong{font-size:14px}.subtle{color:var(--muted)}.small{font-size:12px}.xsmall{font-size:11px}.value{font-size:17px;font-weight:750;color:var(--fg)}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{display:grid;gap:11px}.stat svg{color:var(--accent)}.stat strong{font-size:18px}.stack{display:grid;gap:11px}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.input{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:13px 14px;width:100%;min-height:44px;outline:none}.input::placeholder{color:var(--muted)}.search-wrap{position:relative}.search-wrap .search-icon{position:absolute;left:13px;top:13px;color:var(--muted)}.search-wrap input{padding-left:41px}.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:100px;font-size:11px;padding:9px 13px;white-space:nowrap}.chip.selected{background:var(--active);border-color:var(--accent);color:var(--accent);font-weight:700}.filter-row{gap:7px;padding:4px 0 7px}.player-avatar{width:49px;height:49px;display:grid;place-items:center;background:var(--card);border-radius:12px;color:var(--accent);font-weight:800;font-size:12px}.player-name{font-weight:750;font-size:15px;margin-bottom:5px}.player-top{display:flex;justify-content:space-between;gap:8px;align-items:start}.player-info{display:flex;gap:12px;align-items:center;min-width:0}.player-meta{font-size:12px;color:var(--muted)}.favorite{color:var(--muted)}.favorite.on{color:var(--accent);background:var(--active)}.favorite.on svg{fill:currentColor}.player-bottom{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-top:16px}.label{font-size:11px;color:var(--muted);margin-bottom:4px}.money{font-weight:700;font-size:13px}.empty{text-align:center;padding:32px 17px;color:var(--muted)}.empty svg{width:31px;height:31px;display:block;margin:0 auto 12px}.field-label{display:block;font-size:13px;font-weight:700;margin-bottom:9px}.hint{font-size:12px;color:var(--muted);line-height:1.6}.divider{border:none;border-top:1px solid var(--line);margin:18px 0}.range{accent-color:var(--accent);width:100%;height:20px}.sum{background:var(--card);border-radius:10px;padding:15px;display:grid;gap:10px}.offer-player{background:var(--card);padding:13px;border-radius:10px}.state-tag{font-size:11px;font-weight:800;white-space:nowrap;padding:7px 9px;border-radius:7px;background:var(--card);color:var(--accent)}.state-tag.ok{color:var(--good)}.state-tag.warn{color:var(--warn)}.state-tag.danger{color:var(--danger)}.mail-item{width:100%;display:flex;text-align:left;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);padding:15px;border-radius:11px;color:var(--fg)}.mail-item.selected{background:var(--active)}.mail-item .grow{flex:1}.mail-item .title{font-size:13px;font-weight:700}.mail-body{line-height:1.7;font-size:13px}.section-lead{line-height:1.6;color:var(--muted);font-size:12px;margin:0}.footer{border-top:1px solid var(--line);margin-top:36px;padding-top:17px;display:flex;gap:10px;justify-content:space-between;color:var(--muted);font-size:10px}.footer span:last-child{text-align:right}.microline{display:flex;align-items:center;gap:7px}.muted-callout{border:1px dashed var(--line);border-radius:10px;padding:14px;line-height:1.6;font-size:12px;color:var(--muted)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:20;background:#182f4c;color:#fff;border:1px solid #44658a;box-shadow:var(--shadow);border-radius:12px;padding:12px 18px;max-width:min(90vw,480px);text-align:center;font-size:13px;pointer-events:none}.toast[hidden]{display:none}.offer-note{padding-top:10px}.tag-flex{display:flex;flex-wrap:wrap;gap:8px}.signed-info{color:var(--good);font-size:12px;font-weight:700}.error-text{color:var(--danger);font-size:12px}.lineup-row{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:9px;padding:11px}.spacer{flex:1}
@media(max-width:620px){.shell{padding:17px 13px 30px}.brand-name{font-size:16px}.brand-caption{font-size:8px}.logo{width:38px;height:38px}.btn{padding:10px 11px}.actions{gap:7px}.primary-nav{margin-right:-13px;padding-right:13px}.nav-item{min-width:76px}.sub-nav{margin-right:-13px;padding-right:13px}.content-head h1{font-size:20px}.budget-pill{padding:10px;min-width:116px}.budget-pill b{font-size:12px}.panel{padding:14px}.player-bottom{flex-wrap:wrap}.player-bottom>.btn{margin-left:auto}.season-row{font-size:11px}}
@media(max-width:360px){.brand-caption{display:none}.btn-small{font-size:11px}.actions .btn{font-size:11px}.player-bottom{gap:8px}.money{font-size:12px}.nav-item{min-width:70px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body data-theme="dark">
<div class="shell">
<header>
  <div class="header">
    <div class="brand"><div class="logo" id="brand-icon"></div><div><div class="brand-name">LOL-GM</div><div class="brand-caption">MANAGEMENT SYSTEM</div></div></div>
    <div class="actions"><button class="icon-button" data-action="theme" title="테마 전환" aria-label="테마 전환" id="theme-button"></button><button class="btn btn-primary" data-action="advance" id="advance-button">+1주 진행 <span aria-hidden="true">›</span></button></div>
  </div>
  <div class="season-row"><div class="microline" id="season-label"></div><div class="status-dot"><span class="dot"></span>시뮬레이션 진행 중</div></div>
</header>
<div class="nav-wrap"><nav class="primary-nav" aria-label="메인 메뉴" id="primary-nav"></nav></div>
<nav class="sub-nav" aria-label="하위 메뉴" id="sub-nav"></nav>
<div class="content-head"><div><div class="eyebrow">INTERACTIVE UI PROTOTYPE</div><h1 id="content-title"></h1></div><div class="budget-pill"><small>잔여 이적 예산</small><b id="budget-label"></b></div></div>
<main class="content" id="content"></main>
<footer class="footer"><span>LOL-GM · UI v2 CONCEPT</span><span>독립형 시안 · 가상 선수 및 게임 데이터</span></footer>
</div><div class="toast" id="toast" role="status" hidden></div>
<script>
/* Self-contained reference prototype, NOT production game logic. */
(function(){'use strict';
const STORAGE_KEY='lolgm-demo-ui-v2-20261014';
const players=[
{id:'p1',name:'Raven',lane:'TOP',team:'Nova',fee:210,wage:130,rating:79},
{id:'p2',name:'Vex',lane:'JUNGLE',team:'Mirage',fee:280,wage:190,rating:84},
{id:'p3',name:'Aster',lane:'MID',team:'Phoenix',fee:390,wage:260,rating:89},
{id:'p4',name:'Prism',lane:'BOT',team:'Nova',fee:310,wage:210,rating:85},
{id:'p5',name:'Morrow',lane:'SUPPORT',team:'Arc',fee:180,wage:120,rating:78}
];
const menus=[
{name:'홈',icon:'home',tabs:['대시보드','구단 소식']},
{name:'선수단',icon:'users',tabs:['선수 목록','라인업','계약']},
{name:'이적시장',icon:'transfer',tabs:['시장 현황','선수 검색','관심 선수','계약 제안','진행 중인 협상']},
{name:'스카우트',icon:'search',tabs:['선수 탐색','스카우트 보고서']},
{name:'일정',icon:'calendar',tabs:['경기 일정','결과','훈련']},
{name:'대회',icon:'trophy',tabs:['순위','대진표']},
{name:'분석',icon:'chart',tabs:['팀 분석','선수 분석']},
{name:'재정',icon:'wallet',tabs:['예산','지출 내역']},
{name:'받은편지함',icon:'mail',tabs:['전체 메시지','읽지 않음']},
{name:'설정',icon:'settings',tabs:['화면 테마','데모 데이터']}
];
const paths={
'game':'<rect x="3" y="8" width="18" height="11" rx="4"/><path d="M8 11v5M5.5 13.5h5M15.5 12h.01M18 15h.01"/>',
'home':'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
'users':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 'transfer':'<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>',
'calendar':'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',
'trophy':'<path d="M8 21h8m-4-4v4M7 4h10v7a5 5 0 0 1-10 0V4zM7 6H4v3a3 3 0 0 0 3 3M17 6h3v3a3 3 0 0 1-3 3"/>',
'chart':'<path d="M3 3v18h18M7 17v-5M12 17V8M17 17V5"/>',
'wallet':'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M16 15h2"/>',
'mail':'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m3 6 9 7 9-7"/>',
'settings':'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.8 1.8 0 0 0 .36 2l-2 2a1.8 1.8 0 0 0-2-.36 8 8 0 0 1-2 .8 1.8 1.8 0 0 0-1.2 1.6h-2a1.8 1.8 0 0 0-1.2-1.6 8 8 0 0 1-2-.8 1.8 1.8 0 0 0-2 .36l-2-2a1.8 1.8 0 0 0 .36-2 8 8 0 0 1-.8-2 1.8 1.8 0 0 0-1.6-1.2v-2a1.8 1.8 0 0 0 1.6-1.2 8 8 0 0 1 .8-2 1.8 1.8 0 0 0-.36-2l2-2a1.8 1.8 0 0 0 2 .36 8 8 0 0 1 2-.8A1.8 1.8 0 0 0 10 2h2a1.8 1.8 0 0 0 1.2 1.6 8 8 0 0 1 2 .8 1.8 1.8 0 0 0 2-.36l2 2a1.8 1.8 0 0 0-.36 2 8 8 0 0 1 .8 2A1.8 1.8 0 0 0 22 11v2a1.8 1.8 0 0 0-1.6 1.2 8 8 0 0 1-1 .8z"/>',
'search':'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
'star':'<path d="m12 2 3 6 6.6 1-4.8 4.7 1.1 6.6L12 17.2l-5.9 3.1 1.1-6.6L2.4 9 9 8z"/>',
'clock':'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
'check':'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
'sun':'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',
'moon':'<path d="M20.5 14a8.6 8.6 0 0 1-10.5-10.5A8.6 8.6 0 1 0 20.5 14z"/>',
'info':'<circle cx="12" cy="12" r="10"/><path d="M12 11v5M12 8h.01"/>',
'filter':'<path d="M4 7h16M7 12h10m-7 5h4"/>'
};
const ico=(name,size=20)=>`<svg class="ico" style="width:${size}px;height:${size}px" viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.info}</svg>`;
const esc=v=>String(v).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
/* Player fees and annual wages in this DEMO are stored as millions of KRW. UI formatting only; never apply this to production values without verifying their unit. */
function money(millions){const won=Math.round(Math.abs(millions)*1_000_000);const eok=Math.floor(won/100_000_000);const man=Math.floor((won%100_000_000)/10_000);const rest=won%10_000;const parts=[];if(eok)parts.push(eok.toLocaleString('ko-KR')+'억');if(man)parts.push(man.toLocaleString('ko-KR')+'만');const sign=millions<0?'-':'';if(!parts.length)return sign+won.toLocaleString('ko-KR')+'원';return sign+parts.join(' ')+(rest?' '+rest.toLocaleString('ko-KR')+'원':' 원');}
const fresh=()=>({mode:'dark',section:'이적시장',tab:'선수 검색',week:3,budget:1200,query:'',lane:'ALL',watch:[],selectedId:'p1',fee:210,wage:130,offers:[],editingId:null,inbox:[{id:'m0',week:3,title:'2026 스프링 이적시장 개장',body:'이적시장이 열렸습니다. 관심 선수를 등록하고 계약 제안을 진행할 수 있습니다.',read:false}],selectedMailId:'m0'});
let s=fresh();try{const val=JSON.parse(localStorage.getItem(STORAGE_KEY));if(val&&typeof val==='object'&&Array.isArray(val.offers)&&Array.isArray(val.inbox)){s={...s,...val};}}catch(_){}
if(!menus.some(m=>m.name===s.section))s.section='이적시장';if(!menus.find(m=>m.name===s.section).tabs.includes(s.tab))s.tab=menus.find(m=>m.name===s.section).tabs[0];
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}catch(_){}}
const q=id=>document.getElementById(id);const getMenu=()=>menus.find(m=>m.name===s.section);const findP=id=>players.find(p=>p.id===id);const signed=id=>s.offers.some(o=>o.playerId===id&&o.stage==='계약 완료');const active=id=>s.offers.find(o=>o.playerId===id&&!['계약 완료','철회','거절'].includes(o.stage));const unread=()=>s.inbox.filter(m=>!m.read).length;
function showToast(msg){const t=q('toast');t.textContent=msg;t.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.hidden=true,2400);}
function renderHeader(){document.body.dataset.theme=s.mode;q('brand-icon').innerHTML=ico('game',23);q('theme-button').innerHTML=ico(s.mode==='dark'?'sun':'moon',18);q('season-label').innerHTML=ico('calendar',15)+`<span>2026 스프링 · ${s.week}주차</span>`;q('content-title').textContent=s.tab;q('budget-label').textContent=money(s.budget);}
function renderNav(){const nav=q('primary-nav');const prev=nav.scrollLeft;nav.innerHTML=menus.map(m=>`<button class="nav-item ${m.name===s.section?'selected':''}" data-action="menu" data-section="${esc(m.name)}" aria-current="${m.name===s.section?'page':'false'}">${ico(m.icon,21)}<span>${esc(m.name)}</span>${m.name==='받은편지함'&&unread()?`<span class="tiny-count">${unread()}</span>`:''}</button>`).join('');nav.scrollLeft=prev;const sub=q('sub-nav');const sp=sub.scrollLeft;sub.innerHTML=getMenu().tabs.map(t=>`<button class="sub-item ${s.tab===t?'selected':''}" data-action="tab" data-tab="${esc(t)}" aria-current="${s.tab===t?'page':'false'}">${esc(t)}</button>`).join('');sub.scrollLeft=sp;}
const btn=(text,act,cls='btn-outline',attrs='')=>`<button class="btn ${cls}" data-action="${act}" ${attrs}>${text}</button>`;
const stat=(icon,label,value)=>`<div class="panel stat">${ico(icon,19)}<div class="subtle small">${esc(label)}</div><strong>${esc(value)}</strong></div>`;
function playerCard(p){const watched=s.watch.includes(p.id);const isSigned=signed(p.id);return `<article class="panel"><div class="player-top"><div class="player-info"><div class="player-avatar">${esc(p.lane==='JUNGLE'?'JG':p.lane==='SUPPORT'?'SUP':p.lane)}</div><div><div class="player-name">${esc(p.name)} ${isSigned?'<span class="signed-info">· 영입 완료</span>':''}</div><div class="player-meta">${esc(p.team)} · ${esc(p.lane)} · 평점 ${p.rating}</div></div></div><button class="icon-button favorite ${watched?'on':''}" data-action="watch" data-player="${p.id}" title="${watched?'관심 선수 해제':'관심 선수 등록'}" aria-label="${esc(p.name)} ${watched?'관심 선수 해제':'관심 선수 등록'}" aria-pressed="${watched}">${ico('star',19)}</button></div><div class="player-bottom"><div><div class="label">예상 이적료</div><div class="money">${money(p.fee)}</div></div><div><div class="label">희망 연봉</div><div class="money">${money(p.wage)} / 년</div></div>${btn(isSigned?'영입 완료':(active(p.id)?'협상 확인':'협상 →'),'choose-player','btn-outline btn-small',`data-player="${p.id}" ${isSigned?'disabled':''}`)}</div></article>`;}
function listHTML(){const list=players.filter(p=>{if(s.tab==='관심 선수'&&!s.watch.includes(p.id))return false;if(s.tab==='선수 검색'){if(s.lane!=='ALL'&&s.lane!==p.lane)return false;const needle=s.query.toLowerCase().trim();if(!(p.name+' '+p.team+' '+p.lane).toLowerCase().includes(needle))return false;}return true;});if(!list.length)return `<div class="panel empty">${ico('search',28)}<div>${s.tab==='관심 선수'?'등록된 관심 선수가 없습니다.':'조건에 맞는 선수가 없습니다.'}</div><div style="margin-top:14px">${btn('선수 검색으로 이동','go-search','btn-outline btn-small')}</div></div>`;return list.map(playerCard).join('');}
function playerSearch(){const isSearch=s.tab==='선수 검색';return `${isSearch?`<div class="search-wrap"><span class="search-icon">${ico('search',19)}</span><input class="input" id="search-field" type="search" autocomplete="off" placeholder="선수 이름 또는 소속 팀 검색" value="${esc(s.query)}" aria-label="선수 검색"></div><div class="filter-row" aria-label="포지션 필터">${['ALL','TOP','JUNGLE','MID','BOT','SUPPORT'].map(l=>`<button class="chip ${s.lane===l?'selected':''}" data-action="lane" data-lane="${l}">${l==='ALL'?'전체':l}</button>`).join('')}</div>`:''}<div class="stack" id="player-list">${listHTML()}</div>`;}
function offerPage(){const p=findP(s.selectedId)||players[0];const edit=s.offers.find(o=>o.id===s.editingId);const blocked=active(p.id)&&!edit;const notAllowed=s.fee>s.budget||!!blocked||signed(p.id);const warnings=[s.fee>s.budget?'제안 이적료가 잔여 이적 예산을 초과합니다.':'',blocked?'해당 선수와 진행 중인 제안이 있습니다. 협상 목록에서 확인하세요.':'',signed(p.id)?'이미 영입이 완료된 선수입니다.':''].filter(Boolean);return `<div class="panel stack" style="gap:18px"><div><label class="field-label" for="player-select">영입 대상 선수</label><select class="input" id="player-select">${players.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)} · ${esc(x.lane)}</option>`).join('')}</select><p class="hint">${esc(p.team)} 소속 · 예상 이적료 ${money(p.fee)} · 희망 연봉 ${money(p.wage)} / 년</p></div><hr class="divider" style="margin:0"><div><div class="between"><label for="fee-range" class="field-label">제안 이적료</label><b id="fee-value" style="color:var(--accent)">${money(s.fee)}</b></div><input type="range" id="fee-range" class="range" min="0" max="600" step="10" value="${s.fee}"></div><div><div class="between"><label for="wage-range" class="field-label">제안 연봉</label><b id="wage-value" style="color:var(--accent)">${money(s.wage)} / 년</b></div><input type="range" id="wage-range" class="range" min="50" max="350" step="10" value="${s.wage}"></div><div class="sum"><div class="between small"><span class="subtle">현재 이적 예산</span><b>${money(s.budget)}</b></div><div class="between small"><span class="subtle">제안 후 잔여 예산(가정)</span><b id="remaining-value">${money(s.budget-s.fee)}</b></div><div class="hint">제안 단계에서는 예산이 차감되지 않습니다. 연봉은 이적료와 별도이며, 실제 게임에서 급여 예산 검증이 필요합니다.</div></div><div><div class="error-text" id="offer-warning">${warnings.join(' ')}</div>${btn(edit?'수정 제안 발송':'계약 제안 발송 →','submit-offer','btn-primary btn-full',`id="submit-offer" ${notAllowed?'disabled':''}`)}</div></div>`;}
function stageClass(stage){return stage==='계약 완료'?'ok':['조건 조정 요청','예산 부족'].includes(stage)?'warn':stage==='거절'?'danger':'';}
function negotiations(){if(!s.offers.length)return `<div class="panel empty">${ico('clock',31)}<div>진행 중인 협상이 없습니다.</div><div style="margin-top:14px">${btn('선수 찾아보기','go-search','btn-primary')}</div></div>`;return `<div class="stack">${[...s.offers].reverse().map(o=>{const p=findP(o.playerId);if(!p)return '';const info={'응답 대기':'주차를 진행하면 구단의 답변이 도착합니다.','구단 승인':'제안이 승인되었습니다. 다음 주차에 예산을 확인하고 계약이 완료됩니다.','조건 조정 요청':'상대 구단이 더 나은 조건을 요구했습니다. 제안을 수정할 수 있습니다.','거절':'제안 조건이 기대치에 크게 미치지 못해 거절됐습니다.','계약 완료':'이적료가 차감되고 영입 선수 목록에 반영됐습니다.','예산 부족':'승인된 이적료를 지급할 예산이 부족합니다.','철회':'제안을 철회했습니다.'}[o.stage]||'';return `<article class="panel stack"><div class="between"><div><div class="player-name">${esc(p.name)}</div><div class="player-meta">제안 ${o.week}주차 · 이적료 ${money(o.fee)} · 연봉 ${money(o.wage)} / 년</div></div><span class="state-tag ${stageClass(o.stage)}">${esc(o.stage)}</span></div><div class="hint">${esc(info)}</div>${['조건 조정 요청','예산 부족'].includes(o.stage)?btn('조건 수정하기 →','revise','btn-outline btn-full',`data-offer="${o.id}"`):''}${['응답 대기','구단 승인','조건 조정 요청'].includes(o.stage)?btn('제안 철회','withdraw','btn-outline btn-small',`data-offer="${o.id}"`):''}</article>`;}).join('')}</div>`;}
function inboxPage(){const list=s.inbox.filter(m=>s.tab!=='읽지 않음'||!m.read);const selected=s.inbox.find(m=>m.id===s.selectedMailId);return `<div class="stack">${list.length?list.map(m=>`<button class="mail-item ${m.id===s.selectedMailId?'selected':''}" data-action="mail" data-mail="${esc(m.id)}">${ico('mail',20)}<div class="grow"><div class="title">${m.read?'':'● '}${esc(m.title)}</div><div class="player-meta" style="margin-top:5px">${m.week}주차</div></div><span class="subtle">›</span></button>`).join(''):`<div class="panel empty">읽지 않은 메시지가 없습니다.</div>`}${selected?`<div class="panel"><div class="panel-heading"><strong>${esc(selected.title)}</strong><span class="small subtle">${selected.week}주차</span></div><div class="mail-body">${esc(selected.body)}</div></div>`:''}</div>`;}
function dashboard(){return `<div class="grid-2">${stat('calendar','현재 주차',s.week+'주차')}${stat('wallet','잔여 예산',money(s.budget))}${stat('users','신규 영입',s.offers.filter(o=>o.stage==='계약 완료').length+'명')}${stat('mail','읽지 않은 메시지',unread()+'건')}</div><div class="panel stack"><div class="panel-heading"><strong>구단 운영 요약</strong><span class="small subtle">가상 시뮬레이션</span></div><p class="section-lead">이적시장과 협상 상태를 확인하고, 주차를 진행해 선수 영입 결과를 반영할 수 있습니다.</p>${btn('이적시장으로 이동 →','go-search','btn-primary')}</div>`;}
function roster(){const done=s.offers.filter(o=>o.stage==='계약 완료');return `<div class="panel stack"><div class="panel-heading"><strong>새롭게 영입한 선수</strong><span class="small subtle">${done.length}명</span></div>${done.length?done.map(o=>{const p=findP(o.playerId);return `<div class="lineup-row"><div class="player-avatar" style="width:40px;height:40px">${esc(p.lane)}</div><div class="spacer"><b>${esc(p.name)}</b><div class="small subtle">${p.lane} · ${money(o.fee)}</div></div>${ico('check',21)}</div>`;}).join(''):'<p class="section-lead">시연 데이터 기준으로 영입 완료된 선수가 없습니다.</p>'}</div><div class="muted-callout">기존 팀 로스터, 포지션 배치, 계약 기록은 실제 LOL-GM 코드베이스와 연결해야 합니다. 이 페이지는 데모에서 체결한 신규 영입만 보여줍니다.</div>`;}
function finances(){const done=s.offers.filter(o=>o.stage==='계약 완료');const spent=done.reduce((n,o)=>n+o.fee,0);return `<div class="grid-2">${stat('wallet','현재 이적 예산',money(s.budget))}${stat('chart','이적료 지출 합계',money(spent))}</div><div class="panel stack"><div class="panel-heading"><strong>이적료 지출 내역</strong><span class="small subtle">완료된 계약</span></div>${done.length?done.map(o=>{const p=findP(o.playerId);return `<div class="between small"><span>${esc(p.name)}</span><b>${money(o.fee)}</b></div>`;}).join(''):'<p class="section-lead">이적료 지출 내역이 없습니다.</p>'}</div><div class="muted-callout">데모에서는 이적료만 예산에서 차감합니다. 실제 게임에서는 연봉 예산, 계약 기간, 분할 지급 등 기존 경제 엔진과의 연동이 필요합니다.</div>`;}
function settings(){return `<div class="panel stack"><strong>테마 설정</strong><p class="section-lead">다크 네이비와 라이트 테마를 전환할 수 있습니다.</p><div class="tag-flex">${btn('다크 테마','set-theme','btn-'+(s.mode==='dark'?'soft':'outline'), 'data-theme="dark"')}${btn('라이트 테마','set-theme','btn-'+(s.mode==='light'?'soft':'outline'),'data-theme="light"')}</div></div><div class="panel stack"><strong>프로토타입 데이터</strong><p class="section-lead">변경 사항은 이 브라우저의 로컬 저장소에 보존됩니다. 리셋 시 데모 데이터만 초기화됩니다.</p>${btn('데모 초기화','reset','btn-outline')}</div>`;}
function placeholder(){return `<div class="panel stack"><div class="row" style="color:var(--accent)">${ico(getMenu().icon)}<strong>${esc(s.section)} · ${esc(s.tab)}</strong></div><p class="section-lead">내비게이션 동작 확인용 화면입니다. 실제 일정·대회·분석 등의 정보와 비즈니스 로직은 기존 LOL-GM에 있는 구현을 유지하여 연결해야 합니다.</p></div>`;}
function contentHTML(){if(s.section==='이적시장'){if(s.tab==='선수 검색'||s.tab==='관심 선수')return playerSearch();if(s.tab==='계약 제안')return offerPage();if(s.tab==='진행 중인 협상')return negotiations();return `<div class="grid-2">${stat('star','관심 선수',s.watch.length+'명')}${stat('clock','진행 중인 협상',s.offers.filter(o=>!['계약 완료','철회','거절'].includes(o.stage)).length+'건')}${stat('check','영입 완료',s.offers.filter(o=>o.stage==='계약 완료').length+'명')}${stat('wallet','잔여 예산',money(s.budget))}</div>${btn('선수 검색하기 →','go-search','btn-primary btn-full')}`;}
if(s.section==='받은편지함')return inboxPage();if(s.section==='홈')return dashboard();if(s.section==='선수단')return roster();if(s.section==='재정')return finances();if(s.section==='설정')return settings();if(s.section==='스카우트'&&s.tab==='선수 탐색')return `<div class="panel stack"><strong>선수 탐색</strong><p class="section-lead">관심 선수를 등록하고 이적시장에서 계약 협상을 시작하세요.</p>${btn('선수 검색 열기 →','go-search','btn-primary')}</div>`;return placeholder();}
function render(){save();renderHeader();renderNav();q('content').innerHTML=contentHTML();}
function navigate(section,tab){const m=menus.find(x=>x.name===section);if(!m)return;s.section=m.name;s.tab=m.tabs.includes(tab)?tab:m.tabs[0];render();}
function choosePlayer(id){const p=findP(id);if(!p)return;s.selectedId=id;const a=active(id);if(a){if(['조건 조정 요청','예산 부족'].includes(a.stage)){s.editingId=a.id;s.fee=a.fee;s.wage=a.wage;navigate('이적시장','계약 제안');}else navigate('이적시장','진행 중인 협상');}else{s.editingId=null;s.fee=p.fee;s.wage=p.wage;navigate('이적시장','계약 제안');}}
function inboxPush(title,body){const msg={id:'m'+Date.now()+'-'+Math.random().toString(36).slice(2),week:s.week,title,body,read:false};s.inbox.unshift(msg);return msg;}
function sendOffer(){const p=findP(s.selectedId);if(!p||signed(p.id)||s.fee>s.budget)return;if(active(p.id)&&!s.editingId){showToast('이미 진행 중인 협상이 있습니다.');return;}const id=s.editingId||('o'+Date.now());const instant=s.fee>=Math.ceil(p.fee*1.2)&&s.wage>=Math.ceil(p.wage*1.1);const offer={id,playerId:p.id,fee:s.fee,wage:s.wage,stage:instant?'구단 승인':'응답 대기',week:s.week};if(s.editingId){s.offers=s.offers.map(o=>o.id===id?offer:o);}else s.offers.push(offer);s.editingId=null;inboxPush(p.name+' 계약 제안 '+(instant?'즉시 승인':'발송'),instant?`${p.team} 구단이 제시한 조건을 즉시 승인했습니다. 다음 주차에 예산 검증 후 계약이 완료됩니다.`:`${p.team} 구단에 이적료 ${money(offer.fee)}, 연봉 ${money(offer.wage)} / 년의 제안을 보냈습니다. 다음 주차에 응답을 확인하세요.`);navigate('이적시장','진행 중인 협상');showToast(instant?'좋은 조건으로 즉시 승인됐습니다.':'제안이 발송됐습니다.');}
function advance(){s.week++;for(const o of s.offers){const p=findP(o.playerId);if(!p)continue;const stage=o.stage;if(stage==='응답 대기'){if(o.fee>=p.fee&&o.wage>=p.wage){o.stage='구단 승인';inboxPush(p.name+' · 구단 승인',`${p.team}이 이적료 ${money(o.fee)}, 연봉 ${money(o.wage)} / 년의 제안을 승인했습니다. 다음 주차에 계약이 완료됩니다.`);}else if(o.fee<p.fee*.65||o.wage<p.wage*.6){o.stage='거절';inboxPush(p.name+' · 제안 거절',`${p.team}이 제안한 조건을 거절했습니다.`);}else{o.stage='조건 조정 요청';inboxPush(p.name+' · 조건 조정 요청',`${p.team}이 더 나은 조건을 요청했습니다. 이적 협상 화면에서 수정 제안을 진행하세요.`);}}else if(stage==='구단 승인'){if(s.budget>=o.fee){s.budget-=o.fee;o.stage='계약 완료';inboxPush(p.name+' · 영입 완료',`${p.name} 선수 영입이 완료되었습니다. 이적료 ${money(o.fee)}가 이적 예산에서 차감되었습니다.`);}else{o.stage='예산 부족';inboxPush(p.name+' · 예산 부족',`${p.name} 선수의 영입을 완료하는 데 필요한 이적 예산이 부족합니다.`);}}}render();showToast(`${s.week}주차로 진행했습니다.`);}
function revise(id){const o=s.offers.find(x=>x.id===id);if(!o||!['조건 조정 요청','예산 부족'].includes(o.stage))return;s.selectedId=o.playerId;s.fee=o.fee;s.wage=o.wage;s.editingId=id;navigate('이적시장','계약 제안');}
function withdraw(id){const o=s.offers.find(x=>x.id===id);if(!o||!['응답 대기','구단 승인','조건 조정 요청'].includes(o.stage))return;o.stage='철회';const p=findP(o.playerId);inboxPush(p.name+' · 제안 철회',p.name+' 선수에 대한 제안을 철회했습니다.');render();showToast('제안이 철회됐습니다.');}
function liveOffer(){const fee=q('fee-range'),wage=q('wage-range');if(!fee||!wage)return;s.fee=Number(fee.value);s.wage=Number(wage.value);q('fee-value').textContent=money(s.fee);q('wage-value').textContent=money(s.wage)+' / 년';q('remaining-value').textContent=money(s.budget-s.fee);q('remaining-value').style.color=s.fee>s.budget?'var(--danger)':'';const block=!!(active(s.selectedId)&&!s.editingId);q('offer-warning').textContent=s.fee>s.budget?'제안 이적료가 잔여 예산을 초과합니다.':block?'이미 진행 중인 제안이 있습니다.':'';const b=q('submit-offer');if(b)b.disabled=s.fee>s.budget||block||signed(s.selectedId);save();}
document.addEventListener('input',e=>{if(e.target.id==='search-field'){s.query=e.target.value;q('player-list').innerHTML=listHTML();save();}if(e.target.id==='fee-range'||e.target.id==='wage-range')liveOffer();});
document.addEventListener('change',e=>{if(e.target.id==='player-select'){const p=findP(e.target.value);if(p){s.selectedId=p.id;s.fee=p.fee;s.wage=p.wage;s.editingId=null;render();}}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;
if(a==='theme'||a==='set-theme'){s.mode=a==='theme'?(s.mode==='dark'?'light':'dark'):el.dataset.theme;render();return;}
if(a==='advance'){advance();return;}if(a==='menu'){navigate(el.dataset.section);requestAnimationFrame(()=>q('primary-nav').querySelector('.selected')?.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'}));return;}if(a==='tab'){s.tab=el.dataset.tab;render();requestAnimationFrame(()=>q('sub-nav').querySelector('.selected')?.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'}));return;}if(a==='watch'){const id=el.dataset.player;s.watch=s.watch.includes(id)?s.watch.filter(x=>x!==id):[...s.watch,id];render();return;}if(a==='lane'){s.lane=el.dataset.lane;render();return;}if(a==='choose-player'){choosePlayer(el.dataset.player);return;}if(a==='submit-offer'){sendOffer();return;}if(a==='go-search'){s.query='';s.lane='ALL';navigate('이적시장','선수 검색');return;}if(a==='revise'){revise(el.dataset.offer);return;}if(a==='withdraw'){withdraw(el.dataset.offer);return;}if(a==='mail'){s.selectedMailId=el.dataset.mail;s.inbox=s.inbox.map(m=>m.id===s.selectedMailId?{...m,read:true}:m);render();return;}if(a==='reset'){if(window.confirm('이 프로토타입의 저장 데이터를 초기화할까요?')){s=fresh();render();showToast('데모를 초기화했습니다.');}return;}
});
render();
})();
</script>
</body>
</html>
