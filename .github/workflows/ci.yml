name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      run_full: ${{ steps.scope.outputs.run_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "$head^" 2>/dev/null || true)"
            fi
          fi

          if [[ -n "$base" ]]; then
            mapfile -t changed < <(git diff --name-only "$base" "$head")
          else
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$head")
          fi

          docs_only=true
          if (( ${#changed[@]} == 0 )); then
            docs_only=false
          fi
          for file in "${changed[@]}"; do
            if [[ "$file" == docs/* ]]; then
              continue
            fi
            if [[ "$file" != */* && "$file" == *.md ]]; then
              continue
            fi
            docs_only=false
            break
          done

          run_full=false
          if [[ "$docs_only" != "true" ]]; then
            if [[ "$EVENT_NAME" == "push" || "$PR_DRAFT" != "true" ]]; then
              run_full=true
            fi
          fi

          {
            echo "docs_only=$docs_only"
            echo "run_full=$run_full"
          } >> "$GITHUB_OUTPUT"

          printf 'Changed files (%d):\n' "${#changed[@]}"
          printf '  %s\n' "${changed[@]}"
          echo "docs_only=$docs_only run_full=$run_full"

  static-fast:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static syntax and structure
        run: node scripts/ci-run.mjs static -- npm run check:static

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-static-fast
          path: ci-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn

  ui-finance-contracts:
    needs: [changes, static-fast]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: UI finance and contract acceptances
        run: node scripts/ci-run.mjs ui-finance-contracts -- npm run check:ui-finance-contracts

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-ui-finance-contracts
          path: ci-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn

  calendar-scouting:
    needs: [changes, static-fast]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calendar and scouting acceptances
        run: node scripts/ci-run.mjs calendar-scouting -- npm run check:calendar-scouting

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-calendar-scouting
          path: ci-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn

  medical-core:
    needs: [changes, ui-finance-contracts, calendar-scouting]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Medical core gate
        run: node scripts/ci-run.mjs medical-core -- npm run check:medical-core

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-medical-core
          path: ci-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn

  medical-regional:
    needs: [changes, ui-finance-contracts, calendar-scouting]
    if: needs.changes.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regional medical seed shard
        env:
          MEDICAL_REGIONAL_SHARD: ${{ matrix.shard }}
          MEDICAL_SHARD_OUTPUT: regional-${{ matrix.shard }}.json
        run: node scripts/ci-run.mjs medical-regional -- node scripts/medical-regional-acceptance.mjs

      - name: Upload regional shard summary
        uses: actions/upload-artifact@v4
        with:
          name: medical-regional-${{ matrix.shard }}
          path: regional-${{ matrix.shard }}.json
          if-no-files-found: error

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-medical-regional-${{ matrix.shard }}
          path: ci-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn

  medical-calendar:
    needs: [changes, ui-finance-contracts, calendar-scouting]
    if: needs.changes.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calendar medical seed shard
        env:
          MEDICAL_CALENDAR_SHARD: ${{ matrix.shard }}
          MEDICAL_SHARD_OUTPUT: calendar-${{ matrix.shard }}.json
        run: node scripts/ci-run.mjs medical-calendar -- node scripts/medical-calendar-acceptance.mjs

      - name: Upload calendar shard summary
        uses: actions/upload-artifact@v4
        with:
          name: medical-calendar-${{ matrix.shard }}
          path: calendar-${{ matrix.shard }}.json
          if-no-files-found: error

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-medical-calendar-${{ matrix.shard }}
          path: ci-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn

  medical:
    needs: [changes, medical-core, medical-regional, medical-calendar]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download medical shard summaries
        uses: actions/download-artifact@v4
        with:
          pattern: medical-*
          path: medical-shards
          merge-multiple: true

      - name: Aggregate regional medical invariant
        run: node scripts/ci-run.mjs medical-regional-aggregate -- node scripts/medical-shard-aggregate.mjs regional medical-shards/regional-0.json medical-shards/regional-1.json

      - name: Aggregate calendar medical invariant
        run: node scripts/ci-run.mjs medical-calendar-aggregate -- node scripts/medical-shard-aggregate.mjs calendar medical-shards/calendar-0.json medical-shards/calendar-1.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-medical
          path: ci-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn

  regression:
    needs: [changes, ui-finance-contracts, calendar-scouting]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System snapshot and regression
        run: node scripts/ci-run.mjs system-snapshot -- npm run validate:systems && node scripts/ci-run.mjs regression -- npm run regression

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-regression
          path: ci-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn

  smoke:
    needs: [changes, ui-finance-contracts, calendar-scouting]
    if: needs.changes.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        mode: [core, patch-system]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke coverage shard
        env:
          SMOKE_MODE: ${{ matrix.mode }}
          SMOKE_RESULT_FILE: smoke-${{ matrix.mode }}.json
        run: node scripts/ci-run.mjs smoke -- node scripts/smoke.mjs

      - name: Upload smoke result
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.mode }}
          path: smoke-${{ matrix.mode }}.json
          if-no-files-found: error

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-smoke-${{ matrix.mode }}
          path: ci-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn

  career:
    needs: [changes, ui-finance-contracts, calendar-scouting]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Career acceptance
        run: node scripts/ci-run.mjs career -- npm run career:acceptance

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-career
          path: ci-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn

  regression-smoke-career:
    needs: [changes, regression, smoke, career]
    if: always() && needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Aggregate regression smoke career gate
        shell: bash
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          CAREER_RESULT: ${{ needs.career.result }}
        run: |
          set -euo pipefail
          [[ "$REGRESSION_RESULT" == "success" ]]
          [[ "$SMOKE_RESULT" == "success" ]]
          [[ "$CAREER_RESULT" == "success" ]]
          echo "Regression/smoke/career aggregate gate passed."

  perf-build:
    needs: [changes, ui-finance-contracts, calendar-scouting]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Performance probe
        run: node scripts/ci-run.mjs perf -- npm run perf

      - name: Production build
        run: node scripts/ci-run.mjs build -- npm run build

      - name: Verify production artifact
        run: test -s dist/index.html && cmp -s index.html dist/index.html

      - name: Upload HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: lol-gm-html-preview
          path: dist/index.html
          if-no-files-found: error

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-perf-build
          path: ci-results/
          retention-days: 7
          compression-level: 1
          if-no-files-found: warn

  verify:
    needs:
      - changes
      - static-fast
      - ui-finance-contracts
      - calendar-scouting
      - medical
      - regression-smoke-career
      - perf-build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Aggregate required validation
        shell: bash
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_FULL: ${{ needs.changes.outputs.run_full }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static-fast.result }}
          UI_RESULT: ${{ needs.ui-finance-contracts.result }}
          CALENDAR_RESULT: ${{ needs.calendar-scouting.result }}
          MEDICAL_RESULT: ${{ needs.medical.result }}
          REGRESSION_RESULT: ${{ needs.regression-smoke-career.result }}
          PERF_BUILD_RESULT: ${{ needs.perf-build.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$STATIC_RESULT" == "success" ]]

          if [[ "$DOCS_ONLY" != "true" ]]; then
            [[ "$UI_RESULT" == "success" ]]
            [[ "$CALENDAR_RESULT" == "success" ]]
          fi

          if [[ "$RUN_FULL" == "true" ]]; then
            [[ "$MEDICAL_RESULT" == "success" ]]
            [[ "$REGRESSION_RESULT" == "success" ]]
            [[ "$PERF_BUILD_RESULT" == "success" ]]
          fi

          echo "Required CI gate passed: docs_only=$DOCS_ONLY run_full=$RUN_FULL"

  standalone-sync:
    needs: [changes, perf-build, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.run_full == 'true' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download validated standalone
        uses: actions/download-artifact@v4
        with:
          name: lol-gm-html-preview
          path: validated-standalone

      - name: Sync validated standalone
        run: |
          cp validated-standalone/index.html index.html
          node scripts/sync-standalone.mjs
