name: CI

on:
  workflow_dispatch:
    inputs:
      smoke_parity:
        description: Also prove full/core smoke state and coverage parity
        type: boolean
        default: false
      refactor_parity:
        description: Compare baseline/current state (only for behavior-preserving changes)
        type: boolean
        default: false
      refactor_baseline:
        description: Full baseline commit SHA for refactor/engine parity
        type: string
        default: '0331ffa50a20fce7a4d4e2cd2e032e5c37221e95'
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      run_full: ${{ steps.scope.outputs.run_full }}
      run_ui: ${{ steps.scope.outputs.run_ui }}
      run_calendar: ${{ steps.scope.outputs.run_calendar }}
      run_build: ${{ steps.scope.outputs.run_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify validation scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$GITHUB_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "$head^" 2>/dev/null || true)"
            fi
          fi

          if [[ -n "$base" ]]; then
            mapfile -t changed < <(git diff --name-only "$base" "$head")
          else
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r "$head")
          fi

          node scripts/ci-scope.mjs "$EVENT_NAME" "${changed[@]}"

  static-fast:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static syntax and structure
        run: node scripts/ci-run.mjs static -- npm run check:static

      - name: Validation scope policy
        run: node --test scripts/ci-scope.test.mjs

      - name: Regression runner isolation and failure handling
        run: node --test scripts/regression-runner.test.mjs scripts/ui-evidence-runner.test.mjs && node scripts/verify-regression-runner-evidence.mjs

      - name: 시작 저장 복원과 빈 저장 선택
        run: node scripts/ci-run.mjs startup-save -- node scripts/startup-save-acceptance.mjs

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-static-fast
          path: ci-results/
          retention-days: 3
          compression-level: 1
          if-no-files-found: warn

  ui-finance-contracts:
    needs: [changes, static-fast]
    if: needs.changes.outputs.run_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: UI finance and contract acceptances
        run: node scripts/ci-run.mjs ui-finance-contracts -- node scripts/ui-evidence-runner.mjs

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-ui-finance-contracts
          path: ci-results/
          retention-days: 3
          compression-level: 1
          if-no-files-found: warn

  calendar-scouting:
    needs: [changes, static-fast]
    if: needs.changes.outputs.run_calendar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calendar and scouting acceptances
        run: node scripts/ci-run.mjs calendar-scouting -- npm run check:calendar-scouting

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-calendar-scouting
          path: ci-results/
          retention-days: 3
          compression-level: 1
          if-no-files-found: warn

  medical:
    needs: [changes, static-fast]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Medical core
        run: node scripts/ci-run.mjs medical-core -- npm run check:medical-core
      - name: All medical seed shards and aggregate invariants
        shell: bash
        run: |
          set -euo pipefail
          for shard in 0 1; do
            MEDICAL_REGIONAL_SHARD="$shard" MEDICAL_SHARD_OUTPUT="regional-$shard.json" node scripts/ci-run.mjs "medical-regional-$shard" -- node scripts/medical-regional-acceptance.mjs
            MEDICAL_CALENDAR_SHARD="$shard" MEDICAL_SHARD_OUTPUT="calendar-$shard.json" node scripts/ci-run.mjs "medical-calendar-$shard" -- node scripts/medical-calendar-acceptance.mjs
          done
          node scripts/ci-run.mjs medical-regional-aggregate -- node scripts/medical-shard-aggregate.mjs regional regional-0.json regional-1.json
          node scripts/ci-run.mjs medical-calendar-aggregate -- node scripts/medical-shard-aggregate.mjs calendar calendar-0.json calendar-1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-medical
          path: |
            ci-results/
            regional-*.json
            calendar-*.json
          retention-days: 3
          if-no-files-found: warn

  regression:
    needs: [changes, static-fast]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System snapshot and regression
        run: node scripts/ci-run.mjs system-snapshot -- npm run validate:systems && node scripts/ci-run.mjs regression -- node scripts/regression-runner.mjs

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-regression
          path: ci-results/
          retention-days: 3
          compression-level: 1
          if-no-files-found: warn

  smoke:
    needs: [changes, static-fast]
    if: needs.changes.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        mode: [core, patch-system]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke coverage shard
        env:
          SMOKE_MODE: ${{ matrix.mode }}
          SMOKE_RESULT_FILE: smoke-${{ matrix.mode }}.json
        run: node scripts/ci-run.mjs smoke -- node scripts/smoke.mjs

      - name: Upload smoke result
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.mode }}
          path: smoke-${{ matrix.mode }}.json
          if-no-files-found: error

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-smoke-${{ matrix.mode }}
          path: ci-results/
          retention-days: 3
          compression-level: 1
          if-no-files-found: warn

  career:
    needs: [changes, static-fast]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Career acceptance
        run: node scripts/ci-run.mjs career -- npm run career:acceptance

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-career
          path: ci-results/
          retention-days: 3
          compression-level: 1
          if-no-files-found: warn

  regression-smoke-career:
    needs: [changes, regression, smoke, career]
    if: always() && needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Aggregate regression smoke career gate
        shell: bash
        env:
          REGRESSION_RESULT: ${{ needs.regression.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          CAREER_RESULT: ${{ needs.career.result }}
        run: |
          set -euo pipefail
          [[ "$REGRESSION_RESULT" == "success" ]]
          [[ "$SMOKE_RESULT" == "success" ]]
          [[ "$CAREER_RESULT" == "success" ]]
          echo "Regression/smoke/career aggregate gate passed."

  perf-build:
    needs: [changes, static-fast]
    if: needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Performance probe
        if: needs.changes.outputs.run_full == 'true'
        run: node scripts/ci-run.mjs perf -- npm run perf

      - name: Production build
        run: node scripts/ci-run.mjs build -- npm run build

      - name: Verify production artifact
        run: test -s dist/index.html && cmp -s index.html dist/index.html

      - name: Upload HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: lol-gm-html-preview
          path: dist/index.html
          if-no-files-found: error

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-perf-build
          path: ci-results/
          retention-days: 3
          compression-level: 1
          if-no-files-found: warn

  smoke-parity:
    needs: static-fast
    if: github.event_name == 'workflow_dispatch' && (inputs.smoke_parity || inputs.refactor_parity)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove smoke shard parity
        run: node scripts/ci-run.mjs smoke-parity -- node scripts/smoke-shard-acceptance.mjs

      - name: Prove baseline to current engine parity
        if: inputs.refactor_parity
        env:
          REFACTOR_PARITY_BASELINE: ${{ inputs.refactor_baseline }}
        run: node scripts/ci-run.mjs refactor-parity -- node scripts/refactor-parity.mjs

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-smoke-parity
          path: ci-results/
          retention-days: 3
          if-no-files-found: warn

  verify:
    needs:
      - changes
      - static-fast
      - ui-finance-contracts
      - calendar-scouting
      - medical
      - regression-smoke-career
      - perf-build
      - smoke-parity
      - daily-career-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Aggregate required validation
        shell: bash
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          RUN_FULL: ${{ needs.changes.outputs.run_full }}
          RUN_UI: ${{ needs.changes.outputs.run_ui }}
          RUN_CALENDAR: ${{ needs.changes.outputs.run_calendar }}
          RUN_BUILD: ${{ needs.changes.outputs.run_build }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static-fast.result }}
          UI_RESULT: ${{ needs.ui-finance-contracts.result }}
          CALENDAR_RESULT: ${{ needs.calendar-scouting.result }}
          MEDICAL_RESULT: ${{ needs.medical.result }}
          REGRESSION_RESULT: ${{ needs.regression-smoke-career.result }}
          PERF_BUILD_RESULT: ${{ needs.perf-build.result }}
          DAILY_CAREER_RESULT: ${{ needs.daily-career-smoke.result }}
          PARITY_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && (inputs.smoke_parity || inputs.refactor_parity) }}
          PARITY_RESULT: ${{ needs.smoke-parity.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$STATIC_RESULT" == "success" ]]

          if [[ "$PARITY_REQUIRED" == "true" ]]; then
            [[ "$PARITY_RESULT" == "success" ]]
          fi

          if [[ "$RUN_UI" == "true" ]]; then [[ "$UI_RESULT" == "success" ]]; fi
          if [[ "$RUN_CALENDAR" == "true" ]]; then [[ "$CALENDAR_RESULT" == "success" ]]; fi
          if [[ "$RUN_BUILD" == "true" ]]; then [[ "$PERF_BUILD_RESULT" == "success" ]]; fi

          if [[ "$RUN_FULL" == "true" ]]; then
            [[ "$MEDICAL_RESULT" == "success" ]]
            [[ "$REGRESSION_RESULT" == "success" ]]
            [[ "$PERF_BUILD_RESULT" == "success" ]]
            [[ "$DAILY_CAREER_RESULT" == "success" ]]
          fi

          echo "Required CI gate passed: docs_only=$DOCS_ONLY run_full=$RUN_FULL"

  daily-career-smoke:
    needs: [changes, static-fast]
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One real daily-clock career with international play
        env:
          CAREER_SEASONS: 1
          CAREER_SEED: daily-ci
        run: node scripts/daily-career-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-career-smoke
          path: reports/
          if-no-files-found: error

  standalone-sync:
    needs: [changes, perf-build, verify]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.result == 'success' && needs.changes.outputs.run_build == 'true' && needs.perf-build.result == 'success' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download validated standalone
        uses: actions/download-artifact@v4
        with:
          name: lol-gm-html-preview
          path: validated-standalone

      - name: Sync validated standalone
        run: |
          cp validated-standalone/index.html index.html
          node scripts/sync-standalone.mjs
