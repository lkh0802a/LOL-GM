name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax and structure checks
        run: npm run check

      - name: Performance probe
        run: npm run perf

      - name: Production build
        run: npm run build

      - name: Verify production artifact
        run: test -s dist/index.html

      - name: Sync generated standalone
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: sync generated standalone"
            git push
          fi

      - name: Upload HTML preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lol-gm-html-preview
          path: dist/index.html
          if-no-files-found: error
